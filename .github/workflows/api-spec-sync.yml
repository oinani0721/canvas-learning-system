# Canvas Learning System - API Specification Sync Pipeline
# 规范文档自动化同步检查
#
# 触发条件: OpenAPI 规范或 API 代码变更时
# 功能:
#   1. 快照漂移门: committed backend/openapi.json 必须与 app.openapi() 一致(漂移=红)
#   2. 验证 OpenAPI 规范格式
#   3. 检测破坏性变更 (oasdiff)
#   4. 生成差异报告
#
# ⚠️ CARD-DEBT-openapi-sync [BATCH-2026-09-01-第八批] 修正的假门:
#   本文件此前三处 `if [ -f ... ]` 存在性判断查的是**仓库根**下的规范文件, 而
#   仓库根从来没有这个文件(`git log --all` 对该路径为空) —— 三处恒走 else 分支,
#   "spec changed" 恒为 true, breaking-change 基线恒退化为 `{}`。真实快照一直在
#   `backend/openapi.json`。同时 update-spec job 用 `git push || true` 吞掉失败,
#   job 恒绿却从未推上去任何东西(origin main 上该根级文件至今 404)。
#   现改为: 全部路径指向 backend/openapi.json, 且漂移直接让 job 变红。

name: API Specification Sync

on:
  pull_request:
    paths:
      - 'backend/app/api/**'
      - 'backend/app/models/**'
      - 'specs/api/**'
      - 'backend/openapi.json'
  push:
    branches:
      - main
      - clean-release
    paths:
      - 'backend/app/api/**'
      - 'backend/app/models/**'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # Phase 1: 导出当前 OpenAPI 规范
  # ═══════════════════════════════════════════════════════════════════════════════
  export-openapi:
    name: Export OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      # 产物与 committed 快照同构(同一脚本、同一归一化), 供下游 job 消费。
      - name: Export OpenAPI spec from FastAPI
        run: |
          python scripts/spec-tools/check-openapi-drift.py --write openapi-current.json

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-current
          path: openapi-current.json
          retention-days: 7

      # ⛔ 漂移门: committed 快照与 app.openapi() 归一化后必须相等, 否则 job 红。
      # 归一化只吸收 info.x-generated-at/x-generator、对象成员顺序、required 集合
      # 内序; enum 顺序与其余一切差异照报(规则与依据见脚本模块 docstring)。
      # 修法(在仓库根跑, 禁手改快照):
      #   python scripts/spec-tools/check-openapi-drift.py --write backend/openapi.json
      - name: Snapshot drift gate
        run: |
          python scripts/spec-tools/check-openapi-drift.py --snapshot backend/openapi.json

  # ═══════════════════════════════════════════════════════════════════════════════
  # Phase 2: 验证 OpenAPI 规范格式
  # ═══════════════════════════════════════════════════════════════════════════════
  validate-spec:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    needs: export-openapi
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download current spec
        uses: actions/download-artifact@v4
        with:
          name: openapi-current

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Validate OpenAPI format
        run: |
          spectral lint openapi-current.json --format stylish || true
          # 不强制失败，只报告问题

      - name: Check for critical issues
        run: |
          # 检查必需字段
          python3 -c "
          import json
          with open('openapi-current.json') as f:
              spec = json.load(f)

          issues = []
          if 'openapi' not in spec:
              issues.append('Missing openapi version')
          if 'info' not in spec:
              issues.append('Missing info section')
          if 'paths' not in spec:
              issues.append('Missing paths section')

          if issues:
              print('Critical issues found:')
              for issue in issues:
                  print(f'  - {issue}')
              exit(1)
          else:
              print('OpenAPI spec validation passed')
              print(f'  - Version: {spec.get(\"openapi\")}')
              print(f'  - Title: {spec.get(\"info\", {}).get(\"title\")}')
              print(f'  - Paths: {len(spec.get(\"paths\", {}))}')
          "

  # ═══════════════════════════════════════════════════════════════════════════════
  # Phase 3: 检测破坏性变更
  # ═══════════════════════════════════════════════════════════════════════════════
  detect-breaking-changes:
    name: Detect Breaking Changes
    runs-on: ubuntu-latest
    needs: export-openapi
    if: github.event_name == 'pull_request'
    outputs:
      has-breaking: ${{ steps.oasdiff.outputs.breaking }}
      breaking-count: ${{ steps.oasdiff.outputs.breaking-count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current spec
        uses: actions/download-artifact@v4
        with:
          name: openapi-current

      # `git show` 读 base 分支的 blob 到文件, 不动工作树 —— 旧写法用
      # `git checkout <base> -- <根级规范文件>` 拉一个从不存在的路径, 恒失败后
      # 再用 `git checkout <head> -- .` 试图还原, 基线因此恒为 `{}`(= 任何变更
      # 都不会被 oasdiff 判为 breaking, 门恒绿)。
      - name: Get base branch spec
        run: |
          git show "origin/${{ github.base_ref }}:backend/openapi.json" > openapi-base.json 2>/dev/null \
            || { echo "::warning::base 分支无 backend/openapi.json, breaking 检测基线退化为空对象"; echo '{}' > openapi-base.json; }

      - name: Install oasdiff
        run: |
          curl -sSL https://github.com/Tufin/oasdiff/releases/latest/download/oasdiff_linux_amd64.tar.gz | tar xz
          sudo mv oasdiff /usr/local/bin/

      - name: Run oasdiff
        id: oasdiff
        run: |
          # 检测破坏性变更
          oasdiff breaking openapi-base.json openapi-current.json \
            --format json > breaking-changes.json 2>&1 || true

          # 解析结果
          BREAKING_COUNT=$(python3 -c "
          import json
          try:
              with open('breaking-changes.json') as f:
                  data = json.load(f)
              count = len(data) if isinstance(data, list) else 0
              print(count)
          except:
              print(0)
          ")

          echo "breaking-count=$BREAKING_COUNT" >> $GITHUB_OUTPUT

          if [ "$BREAKING_COUNT" -gt 0 ]; then
            echo "breaking=true" >> $GITHUB_OUTPUT
            echo "::warning::Found $BREAKING_COUNT breaking changes!"
          else
            echo "breaking=false" >> $GITHUB_OUTPUT
            echo "No breaking changes detected"
          fi

      - name: Generate diff report
        run: |
          oasdiff diff openapi-base.json openapi-current.json \
            --format markdown > api-diff-report.md 2>&1 || echo "No changes" > api-diff-report.md

      - name: Upload diff report
        uses: actions/upload-artifact@v4
        with:
          name: api-diff-report
          path: |
            api-diff-report.md
            breaking-changes.json

      - name: Comment PR with changes
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let diffReport = '';
            try {
              diffReport = fs.readFileSync('api-diff-report.md', 'utf8');
            } catch (e) {
              diffReport = 'No API changes detected.';
            }

            let breakingCount = '${{ steps.oasdiff.outputs.breaking-count }}';
            let breakingSection = '';

            if (parseInt(breakingCount) > 0) {
              breakingSection = `
            ## :warning: Breaking Changes Detected

            **${breakingCount} breaking change(s) found!**

            Please review carefully before merging. Breaking changes may affect:
            - Frontend API calls
            - External integrations
            - Obsidian plugin compatibility
            `;
            }

            const body = `## :mag: API Specification Change Report

            ${breakingSection}

            <details>
            <summary>View API Diff</summary>

            ${diffReport}

            </details>

            ---
            *Generated by API Spec Sync workflow*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ═══════════════════════════════════════════════════════════════════════════════
  # Phase 4: 合约测试 (Dredd)
  # ═══════════════════════════════════════════════════════════════════════════════
  # ⛔ 停用 (CARD-DEBT-openapi-sync [BATCH-2026-09-01-第八批])
  # 依据:
  #   1. 本 workflow 在 GitHub 上 24/24 runs 全 failure(2026-04-17 → 2026-06-01),
  #      最新一次 run 里唯一 failure 的 job 就是本 job(Export/Validate/Update 均
  #      success, Detect Breaking skipped)。
  #   2. 失败原因**已不可考**: GitHub 日志保留期已过, 拉取返回 410 Gone。
  #      在原因不明的前提下修它 = 猜, 所以本卡只停用不修。
  #   3. 覆盖面并未因此丢失: schemathesis 在进程内做同类契约校验
  #      (backend/tests/contract/test_openapi_contract.py, from_asgi 直接读 app),
  #      不需要起 uvicorn + Neo4j service 容器。
  # 复活或退役由独立候选卡裁决(已登记, 第九批候补)。届时删掉 `if: false` 即可。
  contract-test:
    name: Contract Test (Dredd)
    runs-on: ubuntu-latest
    if: false
    needs: [export-openapi, validate-spec]
    services:
      neo4j:
        image: neo4j:5.26-community
        ports:
          - 7474:7474
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/testpassword
        options: >-
          --health-cmd "curl -f http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download current spec
        uses: actions/download-artifact@v4
        with:
          name: openapi-current

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          npm install -g dredd

      - name: Start FastAPI server
        run: |
          cd backend
          export NEO4J_URI=bolt://localhost:7687
          export NEO4J_USER=neo4j
          export NEO4J_PASSWORD=testpassword
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10  # 等待服务器启动

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/api/v1/health > /dev/null; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done

      - name: Run Dredd contract tests
        id: dredd
        continue-on-error: true
        run: |
          dredd openapi-current.json http://localhost:8000 \
            --reporter json:dredd-report.json \
            --reporter markdown:dredd-report.md \
            --hookfiles scripts/spec-tools/dredd-hooks.js \
            --method GET \
            --names || true

      - name: Parse Dredd results
        run: |
          python3 -c "
          import json
          try:
              with open('dredd-report.json') as f:
                  data = json.load(f)

              stats = data.get('stats', {})
              print('Contract Test Results:')
              print(f'  - Tests: {stats.get(\"tests\", 0)}')
              print(f'  - Passes: {stats.get(\"passes\", 0)}')
              print(f'  - Failures: {stats.get(\"failures\", 0)}')
              print(f'  - Pending: {stats.get(\"pending\", 0)}')

              if stats.get('failures', 0) > 0:
                  print('::warning::Contract test failures detected')
          except Exception as e:
              print(f'Could not parse Dredd results: {e}')
          "

      - name: Upload Dredd report
        uses: actions/upload-artifact@v4
        with:
          name: dredd-report
          path: |
            dredd-report.json
            dredd-report.md

  # ═══════════════════════════════════════════════════════════════════════════════
  # Phase 5(已删除): 自动提交 OpenAPI 规范文件
  # ═══════════════════════════════════════════════════════════════════════════════
  # 原 update-spec job 已删除 (CARD-DEBT-openapi-sync [BATCH-2026-09-01-第八批])。
  # 它做的是: push main 时把导出结果 `mv` 成**仓库根**的规范文件再
  # `git commit || true; git push || true`。三重失效叠在一起:
  #   - 写的是从不存在的根路径, 与真实快照 backend/openapi.json 无关;
  #   - `|| true` 把 commit 与 push 的失败一并吞掉, job 恒 success;
  #   - 结果就是"恒绿却从未推上去": origin main 至今没有那个根级文件
  #     (gh api contents 404, commits?path 为空)。
  # 快照现在由三处保证新鲜, 不再需要 CI 代写:
  #   1. lefthook pre-commit 的 spec-sync —— 改 API 即重生成并 stage;
  #   2. 本 workflow 的 Snapshot drift gate —— 漂移就红, 逼人本地重生成;
  #   3. 批次收官时在最终主干统一 `--write` 并单独 governance commit。
  # ⚠️ 删除自动提交 job 属 CI/CD 变更, 按默认在车道落 commit 但**不 push**,
  #    合并前须用户逐项批(验收单「待你裁决」)。

  # ═══════════════════════════════════════════════════════════════════════════════
  # Summary Job
  # ═══════════════════════════════════════════════════════════════════════════════
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [export-openapi, validate-spec, detect-breaking-changes, contract-test]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## API Specification Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.export-openapi.result }}" == "success" ]; then
            echo "| Export + Snapshot Drift Gate | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Export + Snapshot Drift Gate | :x: backend/openapi.json 已漂移或导出失败 |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.validate-spec.result }}" == "success" ]; then
            echo "| Validate Spec | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Validate Spec | :x: |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.detect-breaking-changes.outputs.has-breaking }}" == "true" ]; then
            echo "| Breaking Changes | :warning: ${{ needs.detect-breaking-changes.outputs.breaking-count }} found |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Breaking Changes | :white_check_mark: None |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.contract-test.result }}" == "skipped" ]; then
            echo "| Contract Tests (Dredd) | :heavy_minus_sign: 已停用 — 见 job 上方注释; 契约校验由 backend/tests/contract/test_openapi_contract.py (schemathesis) 承担 |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.contract-test.result }}" == "success" ]; then
            echo "| Contract Tests (Dredd) | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Contract Tests (Dredd) | :warning: |" >> $GITHUB_STEP_SUMMARY
          fi

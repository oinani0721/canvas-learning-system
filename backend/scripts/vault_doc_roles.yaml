# ---------------------------------------------------------------------------
# 四值角色口径 (锚定计划书 §3.7 / §4, Karpathy 只作对照, 不引重型治理仪式)
# ---------------------------------------------------------------------------
roles:
  raw:
    definition: >-
      受保护 source。课程材料与转录通常只读; 原白板由用户控制编辑, 系统只把它当
      受保护 source (计划书 §3.7 raw 行原文)。硬边界 1: 不可被自动删除或静默覆盖。
    container_convention: >-
      .trash / .quarantine 这类**退役与隔离容器**按本角色登记: 其内容是 raw/wiki
      混合退役物, 但治理属性与 raw 同构 —— 系统只读、绝不进任何准入面、绝不自动
      重建或清理。这是登记约定, 已显式声明, 不是分类模糊。
  wiki:
    definition: >-
      人类可编辑的中间层: 节点笔记、board recap、解释层 (计划书 §3.7 wiki 行 +
      §4 "可编辑 wiki (节点笔记 / board recap)")。
    boundary_note: >-
      检验白板归此角色而非 derived: 计划书 §4 把 derived 定义为"**可重建**派生层",
      而检验白板承载用户作答与评分, 无 canonical 上游可重放 —— 删了不可重建,
      因此不满足 derived 定义。骨架由 start-exam-board 生成一事记在 provenance。
  schema:
    definition: >-
      frontmatter 契约、BoardManifest、稳定 ID、关系与复习事件契约 (计划书 §3.7
      schema 行)。本台账把**模板与工具/应用定义**一并归此角色 (templates/、
      .claude/ skill 与 hook 定义、.obsidian/ 应用配置、.canvas-config.yaml):
      它们都是"定义别的东西怎么长"的契约面, 不是知识内容本身。
  derived:
    definition: >-
      可重建派生层: LanceDB / Graphiti / 每日 JSON+Markdown / Dashboard / Web UI /
      Excalidraw export (计划书 §4 硬边界 2)。**不得反过来成为真相源**。
      判定要件 = 存在 canonical 上游可重放; 不满足者不许标 derived。
    granularity_note: >-
      ⚠️ 判据的**粒度**说明 (round-6 MEDIUM): `role` 按**产物族**定
      (计划书 §4 硬边界 2 逐项枚举了哪些族属派生层), 而**可重放性逐实例**在该行的
      `retention` 里声明。二者不矛盾但必须分开读: Graphiti/Neo4j 族整体是 derived,
      其中"历史缺正文的 episode"逐条标不可恢复 (G4-11 rebuild matrix);
      思维导图族整体是 derived, 用户导出后添加的摆位/批注逐实例不可重放。
      ⛔ 反过来不成立: 一个**整族**都没有 canonical 上游的东西 (如 `.claudian/sessions`、
      `learning_events.jsonl`、raw 手绘图) 不许标 derived —— 这三处已分别更正为 raw。

# ---------------------------------------------------------------------------
# 双准入面 —— 本卡的核心登记对象
# ---------------------------------------------------------------------------
admission_surfaces:
  rag_index:
    fn: backend/app/services/vault_index_orchestrator.py::VaultIndexOrchestrator.should_index
    sink: LanceDB `<vault>_vault_notes` 表 (行级 doc_type 字段)
    reject_reasons: [outside_vault, not_markdown, blacklisted_dir, blacklisted_file]
    note: >-
      **不拒根级 md** —— 源码注释自述"根级用户笔记可检索是 by-design, 由根级文件名
      黑名单管"(vault_index_orchestrator.py should_index docstring)。
  memory_write:
    fn: backend/app/core/vault_admission.py::check_vault_path
    sink: 文件扫描类记忆写入口 (Neo4j / Graphiti 的 relationship_sync / error_rebuild 等)
    reject_reasons:
      [outside_vault, symlink_escape, not_markdown, root_level, blacklisted_dir, blacklisted_file]
    note: >-
      **拒根级 md** —— reason `root_level`, 源码理由"vault 根级直下的 md
      (Dashboard/CLAUDE/杂项) 不是学习节点"。
  git_dir_note: >-
    校验脚本在目录与文件两个循环里都**无条件跳过 `.git/`** (对抗审查 MEDIUM 登记):
    依据是 `.git` 在 IMMUTABLE_VAULT_SKIP_DIRS 硬底内、且是仓库内部结构而非 vault
    文档面。跳过是刻意的, 不是漏扫 —— 如实登记于此, 避免被读成"扫描面不完整"。
  shared_policy_source:
    dirs: backend/app/config.py::Settings.effective_vault_skip_dirs()
      (= VAULT_INDEX_SKIP_DIRS ∪ IMMUTABLE_VAULT_SKIP_DIRS)
    files: backend/lib/agentic_rag/clients/lancedb_client.py::DEFAULT_VAULT_SKIP_FILES
      + DEFAULT_VAULT_SKIP_ROOT_FILES
    note: 目录与文件名黑名单两面共用, 故两列的分歧**只可能**来自各自私有的判定项。

  # ⛔ 以下分歧是 by-design 登记对象, 不是修复对象。
  #    校验脚本按 **类 (pattern)** 而非实例核对: 新增同类文件不判红,
  #    出现**新类**分歧才判红 (G6)。
  by_design_divergences:
    - id: DIV-1-root-level-md
      patterns: ["*.md"]       # vault 根级直下
      scope: root
      requires_resolution_stable: true
      rag_index: true
      memory_write: false
      # ⛔ reason 绑定 (Codex round-1 BLOCKER-2): 只比 (true,false) 布尔对会把
      #    **同向但不同因**的新分歧一并吞掉 —— 实测反例: 根级 symlink
      #    `alias.md -> 节点/x.txt` 也是 (true,false), 但 reason 是 (ok, not_markdown),
      #    与本类论证的 (ok, root_level) 是两回事。覆盖判定必须 reason 逐一相等。
      rag_reason: ok
      memory_reason: root_level
      rationale: >-
        两面对"根级 md"的语义本就不同: 笔记检索面认为根级用户笔记应可检索
        (由根级文件名黑名单收口), 图/记忆写入面认为根级 md 不是学习节点。
        双方源码各自写明了这一意图, 属设计分歧而非缺陷。
      live_instances_2026_08_30:
        - chatgpt-adversarial-review-Q1Q2Q3-2026-05-12.md
      live_instance_count: 1
      note: >-
        其余 9 个根级 md **被两面同时拒, 故不构成分歧**, 但两面给出的 reason 不同
        (Codex round-1 复算修正): 检索面以 `blacklisted_file` 拒 (命中
        DEFAULT_VAULT_SKIP_FILES: CLAUDE.md / Dashboard.md / UAT-* / Untitled* /
        未命名* / 2111.md, 或根级表 excalibrain.md), 记忆面以 `root_level` 拒
        —— 因为 check_vault_path 的 root_level 判定**先于**文件名黑名单。
        结论相同、路径不同, 如实登记。
    - id: DIV-2-md-suffix-case
      # ⛔ 只覆盖**非全小写**后缀 (MD / Md / mD)。刻意不写成 `[Mm][Dd]` ——
      #    那会连全小写 `.md` 一起吃掉, 从而把将来出现的**新** (rag=false/mem=true)
      #    分歧类误判成"已登记", 遮蔽 G6。登记面必须恰好等于已论证的那一类。
      patterns: ["**/*.M[Dd]", "**/*.[Mm]D"]
      scope: any
      requires_resolution_stable: true
      rag_index: false
      memory_write: true
      rag_reason: not_markdown
      memory_reason: ok
      rationale: >-
        should_index 用 `rel_path.endswith(".md")` (大小写敏感);
        check_vault_path 用 `resolved.suffix.lower() != ".md"` (大小写不敏感)。
        故 `节点/FOO.MD` 会被检索面拒、被记忆面收。macOS APFS 大小写不敏感,
        该形态可由外部工具/同步产生。
      live_instances_2026_08_30: []
      live_instance_count: 0
      note: >-
        live vault 当前 0 实例 —— **登记的是类不是实例**, 0 实例不等于不存在该分歧。
        实证依据: 两函数后缀判定行的源码差异 (非推断)。

# ---------------------------------------------------------------------------
# vault 目录逐条 (顺序敏感: 特化行在前, 容器行在后)
# ---------------------------------------------------------------------------
vault_entries:
  # ── 特化行: 跨容器出现、且角色不同于所在容器的目录 ──────────────────────
  - id: dir-chunks
    role: derived
    match:
      dir_glob: ["**/chunks", "**/chunks/**"]
      frontmatter_type: ["(none)"]
    owner: video-to-canvas 切片管道
    editable_by: 无人 (机器产物)
    rag_index: false
    memory_write: false
    rag_retrieval: not_indexed
    provenance: 由 merged.md 切片生成, 与源笔记同内容
    retention: 可重建 (重跑切片即可); 与源笔记双份入库会造成检索重复, 故黑名单
    notes: 黑名单来源 VAULT_INDEX_SKIP_DIRS "chunks" (RAG-S1)

  - id: dir-ai-explanations
    role: derived
    match:
      dir_glob: ["**/*-explanations", "**/*-explanations/**"]
      frontmatter_type: ["(none)"]
    owner: AI 解释生成链
    editable_by: 系统 (可覆盖重生)
    rag_index: false
    memory_write: false
    rag_retrieval: not_indexed
    provenance: 由对应源笔记/转录派生
    retention: 可重建
    notes: 黑名单 glob "*-explanations" (Phase A T1.1 用户实测污染清单)

  - id: dir-excalidraw
    role: raw
    match:
      dir_glob: ["**/Excalidraw", "**/Excalidraw/**"]
      frontmatter_type: ["(none)"]
    owner: 用户 (Obsidian Excalidraw 插件手绘)
    editable_by: 用户
    rag_index: false
    memory_write: false
    rag_retrieval: not_indexed
    provenance: >-
      用户手绘, **无上游**。live 实测 `raw/CS188/Excalidraw/Drawing 2026-04-04 …
      .excalidraw.md` 的 frontmatter 只有 `excalidraw-plugin: parsed` + `tags`,
      **没有 source_board 反链** —— 与 outputs 下的系统导出图 (三张, 均带
      `source_board`) 是两类东西。
    retention: 不可重建 (用户手绘内容, 硬边界 1 禁自动删除)
    notes: >-
      ⛔ 角色更正 (Codex round-1 HIGH): 本行原标 derived, 但台账自己的 derived
      定义要件是"存在 canonical 上游可重放" —— 手绘图不满足。计划书 §4 说的
      "Excalidraw export 是派生层" 指的是**系统导出**那一类, 已单独登记在
      `art-mindmap-excalidraw`; 用户手绘目录不在其列。

  - id: dir-misc-junk
    role: raw
    match:
      dir_glob: ["**/_misc", "**/_misc/**"]
      frontmatter_type: ["(none)"]
    owner: 用户
    editable_by: 用户
    rag_index: false
    memory_write: false
    rag_retrieval: not_indexed
    provenance: 未分类杂项 (下划线前缀 = 非学习内容约定)
    retention: 用户自行清理, 系统不动
    notes: 黑名单 "_misc"

  - id: dir-node-modules
    role: derived
    match:
      dir_glob: ["**/node_modules", "**/node_modules/**"]
      frontmatter_type: ["(none)"]
    owner: npm / 历史插件构建
    editable_by: 无人
    rag_index: false
    memory_write: false
    rag_retrieval: not_indexed
    provenance: >-
      依赖安装产物。live 实测 **35 个文件**（Codex round-1 复算修正: 原写
      "历史残留空壳" 不实）, 集中在 raw/CS188 下两个历史插件/工具目录。
    retention: 可重建 (npm install); 可安全删除
    notes: 黑名单 "node_modules"

  - id: dir-pycache
    role: derived
    match:
      dir_glob: ["**/__pycache__", "**/__pycache__/**"]
      frontmatter_type: ["(none)"]
    owner: CPython
    editable_by: 无人
    rag_index: false
    memory_write: false
    rag_retrieval: not_indexed
    provenance: .py 字节码缓存
    retention: 可重建; 可安全删除
    notes: 无独立黑名单条目, 由 .claude 父目录黑名单覆盖 (实测两面均拒)

  - id: dir-obsidian-app
    role: schema
    match:
      dir_glob: ["**/.obsidian", "**/.obsidian/**"]
      frontmatter_type: ["concept", "exam_board", "(none)"]
    owner: Obsidian 应用与插件
    editable_by: 用户 (经 Obsidian UI) / 插件
    rag_index: false
    memory_write: false
    rag_retrieval: not_indexed
    provenance: 应用配置与插件数据; .obsidian/templates 下含 concept/exam-board 模板副本
    retention: 随 vault 保留; 丢失只影响外观与插件状态
    notes: IMMUTABLE_VAULT_SKIP_DIRS 硬底项

  # ── 学习内容主干 ────────────────────────────────────────────────────────
  - id: dir-yuan-baiban
    role: raw
    match:
      dir_glob: ["原白板", "原白板/**"]
      frontmatter_type: ["whiteboard"]
    owner: 用户
    editable_by: 用户 (系统只读; 计划书 §3.7 "原始白板由用户控制编辑, 系统只把它当受保护 source")
    rag_index: true
    memory_write: true
    rag_retrieval: excluded_by_doc_type
    provenance: 用户手写; source_board 反向链由节点侧维护
    retention: 不可重建 (用户手写内容, 硬边界 1 禁自动删除或静默覆盖)
    notes: >-
      **在库但检索不可见**: doc_type=whiteboard 命中读侧 exclude_doc_types
      (react_agent/tool_executor/agent_graph/supplementary_search_service 共 7 处
      显式 + retriever 1 处默认)。G4-16 §3 登记的 Tier-2 旁路
      (ENABLE_LANCEDB_TIER2_FALLBACK, 默认关) 是该结论的已知边界。

  - id: dir-jiedian
    role: wiki
    match:
      dir_glob: ["节点", "节点/**"]
      frontmatter_type: ["concept", "(none)"]
    owner: 用户 (AI 辅助派生)
    editable_by: 用户 + 系统 (frontmatter mastery/last_reviewed 由复习链回写)
    rag_index: true
    memory_write: true
    rag_retrieval: conditional
    rag_retrieval_note: >-
      ⛔ 不是一刀切 included (round-6 HIGH 实证): 本目录下**无 `type` 且含
      `exam_question_id`** 的考察文件 (`节点/考察-*.md`, exam-quick skill 写入)
      会被写侧推断为 `doc_type=exam_board` (`lancedb_client.py:2749-2757`),
      随后被读侧 `exclude_doc_types` 挡掉 —— 这是**信息隔离的有意设计**
      (题面不得经 RAG 回流)。其余 concept 笔记 = included。
      live vault 实测 `节点/考察-*.md` **0 个**, 故当前无实例 —— 但登记的是类不是实例。

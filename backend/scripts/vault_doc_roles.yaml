      `:100 open(path, "a")`; G3-1 已冻结 schema v1)。
      ⛔ **两个真相源不是同一个对象** (对抗审查 HIGH 的口径澄清):
      `节点/*.md` 的 frontmatter 是 **FSRS 当前态**的真相源 (模块 docstring 原文
      "frontmatter 仍是真相源, 不改架构"); 本文件是 **事件流**的 canonical 记录
      (append-only, 无上游可重放)。
      ⛔ 措辞更正 (round-3 实证, 原写"前者可由后者重放推导"**不成立**):
      ① 写序是**先原子写 frontmatter 再追加 event** (`quiz-answer/SKILL.md` :316-343),
         且 append 失败明示"不影响评分" (`learning_event_log.py:68` 永不抛异常、

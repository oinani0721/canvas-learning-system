# doc_type 取值白名单 —— 本台账是真相源 (卡片 (c) + G4-16 FU-3 移交)
# ---------------------------------------------------------------------------
doc_type_whitelist:
  contract: >-
    本节是 LanceDB `<vault>_vault_notes` 行级 `doc_type` 字段的取值白名单真相源。
    G4-16 census FU-3 明写"枚举口径依 G8-1 raw/wiki/schema 角色台账定版后落地,
    本卡不代 G8-1 冻结值域"。**本台账只定版值域, 不代 FU-3 落地写侧校验** ——
    写侧 frontmatter 直通面的白名单校验仍是 G4-16 FU-3 的移交项。
  writers:
    - backend/lib/agentic_rag/clients/lancedb_client.py 批量索引路径 (推导 → metadata → SQL 列)
    - backend/lib/agentic_rag/clients/lancedb_client.py 单文件更新路径 (同一推导规则)
    - "backend/lib/agentic_rag/clients/lancedb_client.py::add_documents() 通用 sink (无校验透传)"
  derivation_order:
    - frontmatter `type:` 直通 (lower/strip, **无白名单校验**)
    - 无 `type` 但含 `exam_question_id` → 推断 exam_board (信息隔离; :2749-2757)
    - 路径启发 `_is_video_transcript` → video_transcript
    - 默认 → note
  derivation_caveat: >-
    ⚠️ "显式 frontmatter type 优先于路径推断" **只对 note 之外的值成立**
    (round-6 MEDIUM 实证): 覆盖条件写的是 `if fm_doc_type == "note" and
    _is_video_transcript(path)` (`lancedb_client.py:1774` / `:2059`) ——
    显式写 `type: note` 与走默认值得到的 "note" **在这一步不可区分**,
    因此放在 `/videos/` 下的、显式 `type: note` 的笔记仍会被改判 video_transcript。
  value_domain_closed: false
  unclosed_surface: >-
    G4-16 census §4 第 6 行"空串/自由值"如实登记的三个未闭合面:
    (1) frontmatter `type:` 直通无白名单 —— 用户写什么就入库什么;
    (2) `add_documents()` 通用 sink 无校验透传;
    (3) 多模态 image_ocr 写路径**不含 doc_type 字段** → 读侧空串回退。
    live 库当前 0 条野值。收口归 G4-16 FU-3 / FU-4。
  values:
    - value: note
      roles: ["raw", "wiki"]
      registered_by: [dir-jiedian, dir-raw, dir-root-course-cs188, dir-multimodal, dir-wiki]
      write_path: 默认值 (无 frontmatter type 且非视频路径)
      census_verdict_tag: wired
      census_verdict: "接线 —— 不在排除集 → 可检索; 测试契约锁定 (G4-16 §4 行 1)"
      live_rows_2026_08_28: 69
    - value: whiteboard
      roles: ["raw"]
      registered_by: [dir-yuan-baiban]
      write_path: "frontmatter `type: whiteboard` 直通"
      census_verdict_tag: wired
      census_verdict: >-
        接线 —— exclude 集 7+1 处消费 (隔离第二层); 默认 Tier-1 下在库但检索不可见
        = 设计行为 (G4-16 §4 行 3)
      live_rows_2026_08_28: 16
    - value: exam_board
      roles: ["raw", "wiki"]
      registered_by:
        - dir-jianyan-baiban
        - dir-jiedian
        # round-8 引用完整性: 写侧推断不限目录, 凡"允许无 type 且进索引"的条目
        # 都能产出 exam_board, 必须一并登记 (checker 会机械复算这份清单)
        - dir-raw
        - dir-root-course-cs188
        - dir-multimodal
        - dir-wiki
        - root-loose-md
      write_path: >-
        两条: ① 显式 `type: exam_board` frontmatter **直通**
        (round-8 措辞更正: 原写"`检验白板/` 目录形态"不准 —— 目录本身不是派生条件,
        检验白板下的文件是靠自身 frontmatter 带该值); ② **无 `type` 且含 `exam_question_id`** 的文档
        (`lancedb_client.py:2749-2757`) —— 后者**不限目录**, 典型落点是
        exam-quick 写入的 `节点/考察-*.md`, 故 registered_by 含 dir-jiedian
        (round-7 HIGH: 原来只登记了 ① )。
      census_verdict_tag: wired
      census_verdict: >-
        接线 —— live 0 行原因已实测坐实 (无考察文件存在 + 黑名单拦检验白板目录
        两因叠加), 非死值 (G4-16 §4 行 4)
      live_rows_2026_08_28: 0
    - value: video_transcript
      roles: ["raw"]
      registered_by: [dir-raw]
      write_path: 路径启发 `_is_video_transcript`
      census_verdict_tag: wired
      census_verdict: "接线 —— live 分布主力; 与并行 source_type 一起驱动 rerank 权重 (G4-16 §4 行 2)"
      live_rows_2026_08_28: 2001
    - value: concept

      dir-quarantine 的"保留至人工处置, 系统绝不自动清理", **不是**这里的"可安全删除"。
    notes: 命中 DEFAULT_VAULT_SKIP_FILES 的 "UAT-*.md" / "*-test.md" / "TestConcept*.md"

  - id: root-untitled-scratch
    scope: any_level
    governance_scope: root_only
    role: wiki
    match:
      file_glob: ["Untitled*.md", "未命名*.md", "2111.md"]
      frontmatter_type: ["concept", "(none)"]
    owner: 用户 (Obsidian 新建未命名 / 测试残留)
    editable_by: 用户
    rag_index: false
    memory_write: false
    rag_retrieval: not_indexed
    provenance: Obsidian 默认新建文件名; "2111.md" 为登记在案的测试残留
    retention: >-
      **根级实例**可安全删除。governance_scope=root_only —— 深层同名文件
      (如 `raw/CS188/_misc/junk/未命名.md`) 的 owner/retention 以容器行为准
      (raw 素材"不可重建、硬边界 1 禁自动删除"), 本行只贡献准入两列。
    notes: >-
      `Untitled.md` 实测带 `type: concept` frontmatter —— 若文件名黑名单被撤,
      它会以 doc_type=concept 直通入库。黑名单是这里的唯一防线。

  - id: root-pipeline-design
    scope: any_level
    governance_scope: root_only
    role: schema
    match:
      file_glob: ["管道设计.md"]
      frontmatter_type: ["(none)"]
    owner: 开发 (管道设计文档)
    editable_by: Claude + 用户
    rag_index: false
    memory_write: false
    rag_retrieval: not_indexed
    provenance: 工程设计文档
    retention: 可重建 (从 repo)
    notes: >-
      命中 DEFAULT_VAULT_SKIP_FILES "管道设计.md" (任意层级)。
      live vault 根级当前无此文件, 但 `raw/CS188/管道设计.md` 实存并被两面拒 ——
      本行按**文件名类**登记, 覆盖任意层级。

  # ⛔ 兜底行必须排在最后 —— 这是唯一一条"未命中前述文件名黑名单的根级 md",
  #    也是 DIV-1 by-design 分歧的落点。它**不是** catch-all: file_glob 限定
  #    根级 *.md, 且 rag_index/memory_write 两列取值不同, 必须带 divergence_reason。
  - id: root-loose-md
    role: wiki
    match:
      file_glob: ["*.md"]
      # 紧致性: 只列 live 实测存在的值。多列一个值 = 悄悄放宽 G3 (过度声明),
      # test_frontmatter_type_lists_are_tight 会判红。根级散落笔记实测只有无 type 一种。
      frontmatter_type: ["(none)"]
    owner: >-
      **逐实例登记** (见 known_instances) —— 本行不对未来的根级 md 泛化归属。
      round-3 指出: 兜底行镜像的是**准入规则**, 不是来源; 一个机器生成的报告落在根目录
      会被静默读成"用户手写"。故每新增一个根级 md, 校验脚本判 G9 要求逐个登记。
    editable_by: 用户 (逐实例确认)
    known_instances:
      - chatgpt-adversarial-review-Q1Q2Q3-2026-05-12.md
    rag_index: true
    memory_write: false
    rag_retrieval: conditional
    rag_retrieval_note: >-
      ⛔ 不能一刀切 included (round-7 HIGH): 写侧对"**无 `type` 且含 `exam_question_id`**"
      的文档推断 `doc_type=exam_board`(`lancedb_client.py:2749-2757`) —— 该推断
      **不限目录**。本条目允许无 type 的文档, 因此理论上可承载被读侧
      `exclude_doc_types` 排除的考察文件。live vault 实测本目录下 0 个该形态文件,
      其余文档 = included。登记的是类不是实例。
    provenance: >-
      **无固定生产者** —— 这正是本行必须逐实例登记的原因。
      live 唯一实例 `chatgpt-adversarial-review-Q1Q2Q3-2026-05-12.md` = 人工存档的审查记录。
    retention: >-
      按实例定 —— 已登记的那一条为人工存档 (不可重建)。
      新实例在登记前不得继承该结论 (G9 会判红要求登记)。
    divergence_reason: >-
      DIV-1-root-level-md (by-design, 非缺陷): should_index 不拒根级 md ——
      源码 docstring 自述"根级用户笔记可检索是 by-design, 由根级文件名黑名单管";
      check_vault_path 拒根级 md, reason `root_level`, 源码理由"vault 根级直下的 md
      不是学习节点"。两面对同一路径的语义判断本就不同, 各自都写明了意图。
      **本卡只登记不修** —— 消除它需要改其中一面的准入语义, 那是产品决策
      (根级笔记该不该进图), 不是本台账的权限。实测证据:
      324 文件全量双面求值, 分歧恰 1 条, 即此行。
    notes: >-
      顺序契约: 本行必须是 root_files 的**最后一行**, 否则会抢走前面所有
      黑名单行的命中 (脚本 EXPECTED_LAST_ROOT_FILE_ID 常量钉死)。
      ⚠️ 「兜底行是不是软化?」的正面回答 (对抗审查提问): **不是**。真实代码对根级 md
      的规则就是"未命中文件名黑名单即放行", 这一行**如实镜像**了该规则; 若不设它,
      每新增一个根级 md 都会报 G2 噪音, 而真正的风险 (根级笔记进 RAG 不进图)
      恰恰被 DIV-1 显式登记并列为用户裁决点。它也不是 catch-all —— 语义判定
      `is_catch_all("*.md")` 为 False (吃不下任何多段路径), 且受 scope=root 限制。
      **代价如实说明**: 任何新放进 vault 根目录的 .md 都会即刻可被 RAG 检索到 ——
      这正是需要用户拍板的那条产品语义。


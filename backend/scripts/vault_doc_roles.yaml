# CARD-G8-1 (BATCH-2026-08-29-第六批) — raw/wiki/schema 文档角色台账
#
# 真相源锚点:
#   计划书 §3.7 Karpathy 映射表 (L178-191) + §4 目标架构分层与硬边界 (L195-213)
#   + §G8 角色清单 (L343):
#     _bmad-output/审查/2026-08-20-Canvas-Learning-System-生产力化长期Goal计划书.md
#   doc_type 值域对齐: _bmad-output/审查/G4-16-doc-type-census-2026-08-28.md §4/§8
#
# 消费方: backend/scripts/check_vault_doc_roles.py (report / enforce 两档)
# 后续消费方 (登记, 尚未接线): G8-2 统一 /lint 的 raw-derived 混淆子检查
#   (总账 v2 G8-2 明写 "规则读 G8-1 台账")。
#
# ⛔ 契约钉死 (仿 readme_claims_rules.yaml + check_readme_claims.py 先例):
#   1. 本文件**全文 SHA-256** 钉死在脚本 ROLES_SHA256 常量 —— 指纹比对**先于**
#      yaml 解析。改任何一行都必须同 commit 更新脚本常量 (双文件改动, 审查可见),
#      否则退出 2。伪绿无法由本文件单边达成。
#      刷新指纹: python3 backend/scripts/check_vault_doc_roles.py --print-roles-sha
#   2. doc_type_whitelist 的 (value, role, census_verdict_tag) 序列与脚本
#      EXPECTED_DOC_TYPES 常量必须逐条逐序完全一致。
#   3. 顶层节名与脚本 EXPECTED_SECTIONS 必须完全一致。
#
# ⛔ 反软化铁律 (本卡的存在理由):
#   - 双准入面 (rag_index / memory_write) 的分歧是 **by-design 登记对象**,
#     不是 bug —— 禁止为了让两列一致而改代码或改配置。分歧行必填
#     divergence_reason (实测依据 + 归属)。
#   - known_gaps 只豁免 "未登记类型" 三类 finding (G1/G2/G3), 且只接受
#     **字面量**绑定 (禁通配符)。"台账与代码不符" 四类 (G4/G5/G6/G7)
#     **永不可被 known_gaps 豁免** —— 那等于把台账做软来凑绿。
#   - dir_glob 禁止裸通配 ("*" / "**" / "**/*") —— catch-all 会让
#     "未登记类型" 检查恒绿从而失去意义。
#
# 匹配语义:
#   - dir_glob / file_glob: `**/` = 任意层前缀, `/**` = 任意层后缀, `*` = 段内任意,
#     `?` = 段内单字符。路径一律用 vault 相对 POSIX 形式。
#   - **顺序敏感, 先匹配先命中** (防火墙式 ruleset): 特化行必须排在容器行之前。
#   - frontmatter_type 里的 `(none)` = 该类文件允许没有 `type:` frontmatter
#     (写侧 doc_type 会走默认值 note / 路径启发)。
#
# 字段语义 (每行必填, 缺一即 schema 红):
#   id                 稳定标识 (kebab-case, 全局唯一)
#   role               raw | wiki | schema | derived —— 口径见下方 roles 节
#   match              {dir_glob: [...] | file_glob: [...], frontmatter_type: [...]}
#   owner              这类文档的**产出责任方** (谁负责它存在且正确)
#   editable_by        允许改它的角色 (用户 / 系统 / 两者 / 无人)
#   rag_index          是否进 RAG 索引准入面 (vault_index_orchestrator.should_index)
#   memory_write       是否进记忆写入准入面 (vault_admission.check_vault_path)
#                      两列口径 = 该类**Markdown 文档**的准入。非 .md 文件由两面
#                      共有的 not_markdown 规则统一拒 (见 admission_surfaces 的
#                      reject_reasons), 与条目的 per-type 策略无关 —— 校验脚本对
#                      非 md 改判 surface 级不变量, 不拿它比对本列。
#   rag_retrieval      included | excluded_by_doc_type | not_indexed | conditional
#                      `conditional` = 同一条目下**部分**文档被读侧排除, 取该值时
#                      必须另填 rag_retrieval_note 说明哪部分、为什么 (round-6/7)
#                      —— "进了索引表" 与 "检索可见" 在本仓是两件事:
#                      原白板 doc_type=whiteboard 在库但被读侧 exclude_doc_types
#                      挡掉 (信息隔离第二层)。只报 rag_index 会让台账对
#                      信息隔离铁律撒谎, 故设第三列。
#   provenance         来源与可追溯要求
#   retention          生命周期保留期 / 可重建性
#   divergence_reason  **条件必填**: 当 rag_index != memory_write 时必填, 否则禁填
#   notes              可选补充

schema_version: 1
card: CARD-G8-1
batch: BATCH-2026-08-29-第六批

# ---------------------------------------------------------------------------
# live vault 勘测快照 (信息性: 校验脚本复算漂移只报 INFO, 不判红 —— vault 是活的)
# ---------------------------------------------------------------------------
live_vault:
  root: /Users/Heishing/Desktop/canvas/canvas-learning-system/canvas-vault
  vault_id: canvas_vault
  vault_display_name: CS 61B Canvas Vault
  surveyed_at: "2026-08-30"
  survey_method: >-
    只读 os.walk (带错误回收, 见 checker `_walk_vault`) + 直接调用真实准入函数 (should_index / check_vault_path) 逐路径求值;
    零写入, 前后 shasum 对账入证据包。
  admission_probe:

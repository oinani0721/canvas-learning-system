      ② event payload 只含 grade_norm / exam_board / attempt_count,
         **不含 mastery_a/mastery_b/fsrs_\* 最终态** → 即便不丢也重放不出当前态。
      故正确表述是: 二者互不可重建, 事件流是**尽力而为的侧记**, 不是当前态的可重放上游。
    retention: >-

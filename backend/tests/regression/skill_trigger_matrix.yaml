# G5-1 · 信息收集四类触发矩阵 — utterance → expected_skill 断言表
# (BATCH-2026-08-27-第四批 / CARD-G5-1 · Codex 一轮审查后 v2)
#
# 与 _bmad-output/研究/2026-08-27-G5-1-信息收集四类触发矩阵.md 逐条同步,
# 由 backend/scripts/check_skill_trigger_matrix.py 静态校验 (话语漂移/来源档造假/
# 上线状态过期/文档-断言表单边漂移 任一即红)。⛔ 改任何条目必须两处同改。
#
# 字段语义:
#   polarity: positive(应触发某 skill) | negative(不应触发任何 skill)
#   skill_status: live(SKILL.md 已在 vault) | planned(未上线) | planned-extension(已上线 skill 的规划扩展)
#   trigger_today: 今天原样发这句话会不会触发 expected_skill (按现行斜杠约定诚实判定)
#   source.type 铁律 (Codex 一轮 B2 修订):
#     verbatim   = 用户本人原话逐字, 必须带 corpus+line+attribution(引语归属锚, 须与话语同窗口出现)
#     paraphrase = 改写自「用户本人语言或已发生事件」(报告【已发生】记录), 须与声明行号 ±5 行有 ≥4 字重叠;
#                  ⛔ 设计稿/流程稿内容不得标 paraphrase (那是作者构造 → constructed 或 doc-demo)
#     doc-demo   = 文档作者笔下的话语/演示对话 (非用户之口), 须带 corpus+line+attribution
#     constructed= 构造 (可选挂语境 ref)
#   real_floor: 各类「真实源(verbatim+paraphrase)」条数下限 — 语料覆盖诚实自陈的机器锚,
#     阶段回顾/待处理清理 的真实触发语在语料中不存在 (功能未上线, 用户从未说过触发语;
#     伪造真实即冒充原话), 差距明示于矩阵文档 §语料覆盖自陈, 由用户验收裁决。


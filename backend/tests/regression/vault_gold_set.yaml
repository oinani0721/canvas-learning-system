# vault_gold_set.yaml — RAG 阶段 2 检索质量门禁金集 (PLAN RAG-S2-2026-08-09)
#
# 评测对象: vault 笔记检索链 (search_supplementary → LanceDB hybrid)。
# 判分: expect_hit 按 file 子串 + 可选 contains 子串匹配 (NFKC+casefold 归一);
#       grade 分级供 nDCG (3=正解 chunk / 2=正确文件他段 / 1=相关旁证)。
# 污染三档: config.forbidden = 硬禁 (出现即整跑 FAIL);
#           expect_not_hit.max_in_top_k = 配额 (超额计 contamination);
#           max_in_top_k: 0 = 零容忍 (同形歧义硬样本)。
# 纪律 (沿用 memory_gold_set): version 封版, 改 query 必升版;
#       新失败案例先进 vault_gold_set_shadow.yaml; origin 必填可追溯。
#
# ⚠️ ground truth 锚点只用「概念正文/用户手写疑问」— T3 chunk 改造会剥离
#    检验白板题面复述/弃答记录/模板样板, 金集真值不依赖将被剥离的内容。

# version 2 (2026-08-10, 用户决策 T6): vq-f06/vq-h07 移入 shadow —
# 结构性死档实锤 (期望文件全 doc_type=whiteboard 被查询侧排除策略硬排除,
# 反事实去排除后 rank1 立即回归 = 纯策略排除非能力问题); 「定位白板文件」
# 元查询与 supplementary 补充材料定位错位, 待 file_locate 意图路由 backlog。
config:
  version: 2
  vault_id: canvas_vault
  top_k: 20
  tolerance: 0.02
  duplicate_ratio: 0.92
  contamination:
    path_globs: ["raw/*", "raw/CS188/*"]
    doc_types: ["video_transcript"]
  forbidden:
    path_globs: ["检验白板/*", "outputs/*", "验收单/*"]
    doc_types: ["exam_board"]
    markers: ["TestConcept", "UAT-", "m3-e2e"]
  delivery:
    min_relevance: 0.50
    elbow_drop_threshold: 0.25
    hard_cap: 10


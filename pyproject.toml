[project]
name = "canvas-learning-system"
version = "1.0.0"
description = "Obsidian Canvas-based AI-assisted learning system using Feynman Learning Method"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Canvas Learning System Team"}
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-bdd>=7.0",
    # CARD-TOOL-dredd-decide [BATCH-2026-09-05-第十一批]: >=3.0 -> >=4.0。
    # 本文件是 schemathesis 版本口径的**唯一**出处(原先 tests/contract/requirements.txt
    # 另有一处 >=3.19.0, 已改为指回这里)。
    # 为什么必须 >=4.0: backend/tests/contract/test_openapi_contract.py:26 用的是
    # `schemathesis.openapi.from_asgi(...)` —— 这是 4.x 的形态。本机实测 4.14.3:
    #   hasattr(schemathesis, "openapi")            -> True
    #   hasattr(schemathesis.openapi, "from_asgi")  -> True
    #   hasattr(schemathesis, "from_asgi")          -> **False**(顶层的已被移除)
    # 3.25/3.30/3.39 实测: `openapi.from_asgi` 与四个 `checks.*_conformance`
    # **两套并存**, 所以该文件在 3.x 后期是能跑的; 4.x 把 checks 挪进注册表后,
    # 只有注册表写法可用。本卡改用注册表写法 ⇒ 下限必须是 4.0。
    # ⚠️ 本注释**不描述 CI**: 截至本卡, .github/workflows/test.yml 既没有
    #    `python -c 'import schemathesis'` 硬前置(原方案计划加, 重裁后未实施),
    #    也没有把该合约测试放进白名单; 它在 :72 无版本地 `pip install schemathesis`。
    #    详见 _bmad-output/审查/2026-09-05-Dredd-复活或退役-裁决页.md §六。
    "schemathesis>=4.0",
    "hypothesis>=6.0",
    # CARD-TOOL-pyright [BATCH-2026-09-05-第十一批] —— 类型检查器归口。
    # 落在这里而不是 backend/requirements*.txt, 依据是后者文件头自己写的
    # 单一权威规则: "本文件管 backend 生产依赖 / pyproject.toml 管 dev extras"。
    # 消费方: lefthook.yml 的 python-typecheck 块先找 backend/.venv/bin/pyright
    # 再找 PATH; 配置在仓库根 pyrightconfig.json (include 覆盖 backend/app + src
    # + tests, 是仓库级工具而非 backend 专属)。
    # 安装: backend/.venv/bin/python -m pip install 'pyright>=1.1.411'
    # ⚠️ 已知缺口(本卡不接, 已登台账): 没有任何 CI workflow 安装本 extras
    #    (test.yml 是 `cd backend && pip install -r requirements.txt` 再按名字
    #    显式装三个), 所以 pyright 目前**只在本地 pre-commit 生效**。
    "pyright>=1.1.411",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "bdd: BDD tests that execute Gherkin scenarios via pytest-bdd",
    "contract: Contract tests that validate API against OpenAPI specification",
    "integration: Integration tests requiring external services",
    "unit: Unit tests for individual components",
    "slow: Tests that take significant time to run",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.schemathesis]
# Configuration for Schemathesis contract testing
# Reference: docs/architecture/sot-hierarchy.md (OpenAPI is Level 4 SoT)

# Local schema path (used when FastAPI is not running)
schema_path = "specs/api/canvas-api.openapi.yml"

# Base URL for API testing (Epic 15 FastAPI)
# Uncomment when FastAPI is implemented:
# base_url = "http://localhost:8000"

# Test execution settings
max_examples = 100
hypothesis_deadline = 5000  # ms
validate_schema = true

# Stateful testing for workflow scenarios
stateful = "links"

# Check types
checks = [
    "not_a_server_error",
    "status_code_conformance",
    "content_type_conformance",
    "response_headers_conformance",
    "response_schema_conformance",
]

[tool.ruff]
# Python linting configuration
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["canvas_learning_system"]

[tool.mutmut]
# mutmut 3.x config — run manually: cd backend && mutmut run
# NOT in PostToolUse hook (too slow: each mutant = full pytest cycle)
# Use after bug fixes to verify tests aren't facades
paths_to_mutate = ["app/"]
tests_dir = ["tests/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

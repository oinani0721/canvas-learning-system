# Canvas Learning System - Lefthook Configuration
# Replaces hand-written .git/hooks/{pre-commit,post-commit,pre-push}
#
# Install: npx lefthook install
# Test:    npx lefthook run pre-commit
#
# Architecture:
#   pre-commit  → parallel checks (spec-sync, python-lint, python-typecheck, ghost-files)
#   commit-msg  → commitlint + spec-reference
#   post-commit → backup-push
#   pre-push    → frontend-test + backend-smoke

# ============================================================
# Pre-commit: Parallel checks on staged files
# ============================================================
pre-commit:
  # ⛔ 串行(Codex round-3 BLOCKER): flat+root 两条 spec-sync 在一个 commit 同时
  # 触及(如 config.py + 某端点)时会并发, 两条的 `git add backend/openapi.json`
  # 争抢 .git/index.lock → 一方失败 → commit 被误阻断(实测 100/100 碰撞,
  # lefthook 入口四轮 rc=1,1,0,1)。本 hook 各命令都很快(pyright 本机缺席即跳过),
  # 串行的总耗时损失可忽略, 换取 git 写操作互斥。
  parallel: false
  commands:
    # --- Spec Sync: Regenerate OpenAPI snapshot when backend API files change ---
    # CARD-DEBT-openapi-sync [BATCH-2026-09-01-第八批] 把这个 hook 从"死了 4 个月
    # 没人发现"改成"会出声"。原写法三处同时失效, 任何一处都足以让它静默空转:
    #   1. 解析器是裸 `python` —— 本机与 CI 上都不是本仓 venv(甚至可能不存在),
    #      对照同文件 readme-claims-lint 一直用 backend/.venv/bin/python;
    #   2. `2>/dev/null` 把导出失败整个吞掉, 于是失败与成功外观完全相同;
    #   3. 导出脚本默认落到 backend/openapi.json, 而这里 `[ -f openapi.json ]`
    #      查的是**仓库根** —— 那个文件在本仓全部历史中都不存在, 所以永远
    #      走不到 git add。快照 mtime 因此停在 5 月 3 日。
    # 现在: venv 解析器 + 失败 exit 1 阻断 commit + 直接写并 stage backend 下的快照。
    # 代价(已知): 每次改 backend/app/{api,models,schemas} 的 commit 会多花约 20s
    # 导入 app.main 重生成快照, 且快照因 x-generated-at 恒变而必然出现在 diff 里。
    # spec-sync 双命令(Codex round-1/2 BLOCKER-3): app.openapi() 不只由
    # api/models/schemas 塑造 —— main.py(路由挂载)/config.py(设置与前缀)/
    # mcp/**(工具注册改写 schema)都在其中。历史反例 c44c48e8 只改 mcp/server.py
    # 却修复了 requestBody 参数面丢失。
    # ⚠️ glob 引擎实测矩阵(本机 lefthook 2.1.6, 5 文件 × 3 模式逐项探针):
    #   | staged 文件                | {..}/**/*.py | {..}/*.py | {main.py,config.py} |
    #   | api/v1/endpoints/x.py(3级) | 命中          | 命中       | skip                |
    #   | mcp/server.py(1级)         | skip          | 命中       | skip                |
    #   | models/schemas.py(1级)     | skip          | 命中       | skip                |
    #   | main.py / config.py(根)    | skip          | skip       | 命中                |
    #   即: 单 `*` 跨目录层级, `**` 反而要求至少跨一级 → `{..}/**/*.py` 的覆盖集
    #   是 `{..}/*.py` 的真子集(57/85), 单独保留只会造成同文件双命令并行写。
    #   故只留 flat+root 两条**零重叠**命令; 即便如此, 一个 commit 同时触及两命令
    #   的 glob 时仍会并行, 由 --write 的每进程独立 tmp + 原子 rename 兜底。
    #   (round-2 曾用共享 tmp 名, Codex 实测 8 进程碰撞 child_failures=8。)
    spec-sync-flat:
      glob: "backend/app/{api,models,schemas,mcp}/*.py"
      run: |
        if [ -f "backend/.venv/bin/python" ]; then PY="backend/.venv/bin/python"; else PY="python3"; fi
        echo "[Spec Sync] API changes detected, regenerating backend/openapi.json (via $PY)..."
        if ! "$PY" scripts/spec-tools/check-openapi-drift.py --write backend/openapi.json; then
          echo "[Spec Sync] FAILED — 快照未能重生成, 先修好再 commit(禁手改快照)。"
          exit 1
        fi
        git add backend/openapi.json || exit 1
        echo "[Spec Sync] + backend/openapi.json staged"
    spec-sync-root:
      glob: "backend/app/{main.py,config.py}"
      run: |
        if [ -f "backend/.venv/bin/python" ]; then PY="backend/.venv/bin/python"; else PY="python3"; fi
        echo "[Spec Sync/root] API changes detected, regenerating backend/openapi.json (via $PY)..."
        if ! "$PY" scripts/spec-tools/check-openapi-drift.py --write backend/openapi.json; then
          echo "[Spec Sync/root] FAILED — 快照未能重生成, 先修好再 commit(禁手改快照)。"
          exit 1
        fi
        git add backend/openapi.json || exit 1
        echo "[Spec Sync/root] + backend/openapi.json staged"

    # --- Ghost Files: Detect untracked documentation ---
    ghost-files:
      run: |
        GHOST_STORIES=$(git ls-files --others --exclude-standard -- "docs/stories/" 2>/dev/null || true)
        GHOST_EPICS=$(git ls-files --others --exclude-standard -- "docs/epics/" 2>/dev/null || true)
        GHOSTS=""
        if [ -n "$GHOST_STORIES" ]; then GHOSTS="$GHOST_STORIES"; fi
        if [ -n "$GHOST_EPICS" ]; then
          if [ -n "$GHOSTS" ]; then GHOSTS="$GHOSTS
        $GHOST_EPICS"; else GHOSTS="$GHOST_EPICS"; fi
        fi
        if [ -n "$GHOSTS" ]; then
          COUNT=$(echo "$GHOSTS" | wc -l | tr -d ' ')
          echo "[Ghost Files] WARNING: $COUNT untracked doc file(s):"
          echo "$GHOSTS"
          echo "[Ghost Files] To track: git add <file>"
        else
          echo "[Ghost Files] No untracked docs found."
        fi

    # --- Python lint: ruff lint + format check on staged files ---
    # CARD-TOOL-lint-glob [BATCH-2026-09-05-第十一批]: glob 由
    # `{backend,src}/**/*.py` 改为 `{backend,src,scripts}/*.py`。两处改动:
    #   1. 补 scripts/ —— 本仓 tracked .py 的分布是 backend 845 / scripts 91 /
    #      src **0**。即原 glob 的 `src` 分支在**本 SHA 下**匹配不到任何文件
    #      (保留只为与下方 pyright 块的 glob 同形, 不是「恒」空集 —— 有人建
    #      src/ 它就会生效), 而真正有 91 个文件(49 个在一级)的 scripts/
    #      从未过过 ruff 门。
    #   2. `**` 换单 `*` —— 沿用 X8 在本文件 OpenAPI 快照块钉死的引擎矩阵
    #      (lefthook 2.1.6): 单 `*` 跨目录层级, `**` 反而要求至少跨一级。
    #      故天真写法 `{backend,src,scripts}/**/*.py` 会漏掉 scripts/ 一级的
    #      49 个 + backend/ 一级的 2 个(mutmut_config.py / start_server.py)。
    #      本机逐文件探针复验见 UAT-CARD-TOOL-lint-glob-2026-09-05.md。
    #
    # 覆盖面诚实声明(别把本门当 lint 门读): scripts/ 的 ruff 配置解析到**根**
    # ruff.toml 而非 backend/ruff.toml, 其 `[lint] select = []` 让 lint 面成为
    # 空集。所以对 scripts/ 而言 `ruff check` 只拦解析器级 invalid-syntax,
    # 不拦未定义名之类的规则违规 —— 实测 scripts/validate-source-citations.py
    # 的 `generate_report()` 多行 f-string 里有一处 F821(`{technology}`),
    # 现行配置**不报**。(不写死行号: 它已被本卡 commit-2 的 ruff format
    # 从 402 推到 392, 行号会随任何重排漂走。)
    # 真正拦住 scripts/ 的是下面的 `ruff format --check`。开 scripts/ 必错级
    # 规则集(对齐 backend/ruff.toml 的 E9,F63,F7,F82) = 另一张卡, 已登台账。
    python-lint:
      glob: "{backend,src,scripts}/*.py"
      run: |
        # Activate backend venv for ruff
        if [ -f "backend/.venv/bin/activate" ]; then source backend/.venv/bin/activate; fi
        echo "[Python] Running ruff lint..."
        ruff check {staged_files} 2>&1 || exit 1
        echo "[Python] Lint OK."
        echo "[Python] Checking format..."
        ruff format --check {staged_files} 2>&1 || {
          echo "[Python] Format check FAILED! Fix: ruff format {staged_files}"
          exit 1
        }
        echo "[Python] Format OK."

    # --- Python typecheck: pyright on staged files ---
    # HONESTY CONTRACT (CARD-DEBT-hook-pyright, BATCH-2026-09-04-第十批):
    # pyright is NOT a declared dependency of this repo (absent from
    # backend/requirements*.txt, backend/pyproject.toml and backend/.venv);
    # only pyrightconfig.json exists. Before this card the block ended in a bare
    # `echo`, so the shell block's exit code was that echo's 0 -- a missing binary
    # (rc=127) was reported by lefthook as `✔️ python-typecheck`. Worse, 127
    # ("tool absent") and 1 ("real type errors") were funnelled into the same
    # "Type errors found!" line, so the gate could not tell "did not run" from
    # "ran and failed". Now: absent -> explicit SKIP lines + rc 0, with no claim of
    # having checked anything; present -> real run + explicit `exit` of pyright's
    # own rc, so type errors actually block the commit.
    # Installing pyright is deliberately OUT of scope (separate card): this block
    # only stops lying about whether it ran.
    #
    # SCOPE (CARD-TOOL-typecheck-glob, BATCH-2026-09-05-第十二批, 用户裁定 D-1 丙):
    # glob 由 `{backend,src}/**/*.py` 收窄为单条 `backend/app/*.py`。
    # 起因是**位置实参覆盖 include**: 下面 run 块把 {staged_files} 当**位置实参**
    # 传给 pyright, 而位置实参**取代** pyrightconfig.json 的 include(不是与它取
    # 交集) —— 于是旧 glob 的可达面是 **844** 个 .py(backend 目录共 846 个 .py,
    # 减去一级的 2 个 —— 旧 glob 的 `**` 要求至少跨一级, 见下面的死枝登记;
    # 844 里 backend/tests 占 493), 远大于 include 面。测试目录的存量类型债因此
    # 拦下了绝大多数提交(第十一批 CARD-TOOL-pyright 台账逐字记 "18/19 = 94%",
    # 精确值 94.7%; 别把它渲染成 95% 再说成"台账记的"), 而那些报错与被提交的改动
    # 无关 —— 一个恒红的门等于没有门, 只会训练人去绕过它。
    # ⚠️ "报错与改动无关"这半句是**归因**, 本卡零样本核查(没有检视过那 18 次提交
    # 里的任何一次报错内容); 机制上有单例演示(探针只往 conftest.py 追加一行注释,
    # pyright 仍报存量 1 err), 但那是可能性演示, 不是对那 18 次的实测。
    #
    # "位置实参取代 include" 的**直接实证**(不是推论):
    # pyrightconfig.json 的 include = ["backend/app","src","tests"], `backend/tests`
    # 不在其中; 而旧 glob 下把 backend/tests/conftest.py 交给本门, pyright 真的分析
    # 了它并报出 4 条诊断(evidence-typecheck-glob/probe-OLDGLOB-flip.txt)。若语义是
    # 取交集, 它会被 include 排除、零诊断。judge12 存档记录了这条对照。
    # ⚠️ 846 是**目录总量**, 不是旧 glob 的**匹配量**; 两者差 2, 别混用
    # (Codex round-1 抓到本注释初版把这两个数混为一谈, 且与下面的死枝登记自相矛盾)。
    # 收窄后门面 = backend/app 的 263 个 .py, 是 pyrightconfig include 面的真子集:
    #   backend/app 263 + src 0 + 仓库根 tests 41 = 304。
    # 实数以 `git ls-files` 为准(2026-09-05 于 base 4cc4824c 实测); 上面这些都是
    # **tracked .py 的计数**, 不等于 pyright 实际分析的文件数(它还会拉入被 import
    # 的文件)。旧手册里的 258 / 35 是过期数, 不要照抄。
    #
    # ⚠️ glob 语义(本机 lefthook 2.1.6 五档探针实测, transcript 见
    # _bmad-output/审查/evidence-typecheck-glob/): 单 `*` 跨目录层级, 所以单条
    # `backend/app/*.py` 同时命中根级 main.py / 1 级 mcp/server.py / 3 级
    # api/v1/endpoints/health.py, **不需要**像上面 spec-sync 那样拆 flat+root ——
    # 那张矩阵里的"根文件 skip"是花括号子目录 `{api,models,schemas,mcp}` 造成的,
    # 不是单星本身。⚠️ 实测只抽了深度 0 / 1 / 3 三档(深度 2 及更深未测), "跨任意
    # 层级"是对这三个样本的**规则归纳**, 不是穷举; 同理"门面 = 263"是按该规则对
    # 263 条路径的外推, 不是逐条枚举(外审 codex-review §1 已写下同一限定)。
    # 负控(judge14 v2, 每档带三行暂存自证): backend/mutmut_config.py 与
    # backend/start_server.py 在**新旧两套** glob 下均 `(skip) no files for
    # inspection`, 同轮两档正控(main.py 新/旧 glob)均命中 —— 正控排除了
    # "git add 没生效 / 配置解析失败" 这两种会产生相同 skip 字样的假因。
    # 翻转对照: 同一个 backend/tests/conftest.py 在**旧** glob 下真跑并 exit 1,
    # 新 glob 下 skip, 证明收窄确实改变了可达面, 不只是换个写法。
    #
    # 两条死枝, 本卡有意不收(登记, 非疏漏):
    #   src/                       仓库内零 tracked 文件; 旧 glob 的 `src` 分支与
    #                              pyrightconfig 的 "src" 都是死枝。
    #   backend/mutmut_config.py   backend 一级的这 2 个 .py 不在 backend/app 下;
    #   backend/start_server.py    旧 glob(`**` 要求至少跨一级)本来也漏掉它们,
    #                              本卡不借收窄之机扩面。
    #
    # ⚠️ 本块**不声称**任何文件的类型是对的: backend/app 的 263 个文件存量报错未动
    # (pyrightconfig.json 注释里的 592 err 是**整个 include 面 304 文件**的数, 不是
    # backend/app 单独的数, 本卡没有单独测过), backend/tests 493 个文件的类型债也
    # 没清(另卡)。
    # 跑不跑取决于下面的解析链 `backend/.venv/bin/pyright` → PATH → 空: **两个入口
    # 都解析不到**才走 SKIP 分支。主仓当前两处都没有(venv 内 `No such file`, 交互
    # shell 的 PATH 上 `command -v pyright` rc=1), 所以主干上本门仍 SKIP, 收窄 glob
    # 不会让它开始跑 —— 但这是**当前环境的实测**, 不是 glob 决定的; 任何一侧装上
    # pyright 它就会真跑。本车道是 symlink 到含 pyright 的共享 venv, 命中第一个入口。
    python-typecheck:
      glob: "backend/app/*.py"
      run: |
        # Activate backend venv for pyright
        if [ -f "backend/.venv/bin/activate" ]; then source backend/.venv/bin/activate; fi
        # Resolve the binary explicitly: venv first, then PATH. Empty == not installed.
        if [ -x "backend/.venv/bin/pyright" ]; then
          PYRIGHT_BIN="backend/.venv/bin/pyright"
        elif command -v pyright >/dev/null 2>&1; then
          PYRIGHT_BIN="$(command -v pyright)"
        else
          PYRIGHT_BIN=""
        fi
        if [ -z "$PYRIGHT_BIN" ]; then
          echo "[Python] SKIP: pyright not installed (looked for backend/.venv/bin/pyright, then PATH)."
          echo "[Python] SKIP: typecheck did NOT run -- this is NOT a pass. See pyrightconfig.json."
          exit 0
        fi
        echo "[Python] Running pyright type check ($PYRIGHT_BIN)..."
        "$PYRIGHT_BIN" {staged_files} 2>&1
        PYRIGHT_EXIT=$?
        if [ $PYRIGHT_EXIT -ne 0 ]; then
          echo "[Python] Type errors found! Review and fix before committing."
          echo "[Python] Hint: Some errors may be pre-existing. Focus on YOUR changes."
        fi
        echo "[Python] Typecheck done (exit: $PYRIGHT_EXIT)."
        exit $PYRIGHT_EXIT

    # --- Cypher vault-filter lint (wave-5 Stage C) ---
    # Heuristic gate: any *newly staged* `session.run(` or `tx.run(` call in
    # backend/app/services/ or backend/app/clients/ must either:
    #   (1) live in a query that references `group_id` (sign it's vault-scoped), or
    #   (2) be in a function decorated with @allow_cross_vault(...) (admin/migration).
    # See backend/app/utils/cypher_helpers.py for the helper + decorator + backlog.
    #
    # LIMITATIONS:
    # - Pure shell grep; cannot parse multi-line cypher across blocks reliably.
    # - Only inspects *staged additions* (`git diff --cached --diff-filter=AM`).
    # - Pre-existing raw cypher (wave-6 backlog) is NOT retroactively flagged
    #   unless the file is restaged with a new violating line.
    # Catches ~80% of accidental new raw `tx.run()` that omit group_id.
    cypher-vault-filter-lint:
      glob: "backend/app/{services,clients}/**/*.py"
      run: |
        STAGED_FILES=$(git diff --cached --name-only --diff-filter=AM | grep -E "^backend/app/(services|clients)/.*\.py$" || true)
        if [ -z "$STAGED_FILES" ]; then
          echo "[Cypher-Lint] No backend/app/{services,clients} files staged; skipping."
          exit 0
        fi
        VIOLATIONS=""
        for f in $STAGED_FILES; do
          if [ ! -f "$f" ]; then continue; fi
          # Pull the lines this commit ADDS that contain session.run( or tx.run(
          ADDED_LINES=$(git diff --cached -U0 -- "$f" \
            | grep -E '^\+[^+]' \
            | grep -E 'session\.run\(|tx\.run\(' || true)
          if [ -z "$ADDED_LINES" ]; then continue; fi
          # Check whole file for @allow_cross_vault decorator (function-level opt-out)
          FILE_HAS_ALLOW=$(grep -c '@allow_cross_vault' "$f" 2>/dev/null || echo 0)
          # For each added line, require either `group_id` in the line itself OR
          # presence of the allow-decorator anywhere in the file (file-level escape hatch).
          BAD_LINES=$(echo "$ADDED_LINES" | grep -v 'group_id' || true)
          if [ -n "$BAD_LINES" ] && [ "$FILE_HAS_ALLOW" -eq 0 ]; then
            VIOLATIONS="${VIOLATIONS}${f}:
        ${BAD_LINES}
        "
          fi
        done
        if [ -n "$VIOLATIONS" ]; then
          echo ""
          echo "[Cypher-Lint] ❌ Raw cypher without group_id filter in staged diff:"
          echo "$VIOLATIONS"
          echo "[Cypher-Lint] Fix one of:"
          echo "  1. Use cypher_with_group_filter() from app.utils.cypher_helpers"
          echo "  2. Mark the function with @allow_cross_vault(reason='...') if intentional"
          echo "[Cypher-Lint] See backend/app/utils/cypher_helpers.py for backlog + rationale."
          exit 1
        fi
        echo "[Cypher-Lint] OK (no new raw cypher without group_id)."

    # --- README claims lint (CARD-G1-5, BATCH-2026-08-27-第四批) ---
    # 仿 cypher-vault-filter-lint 的 staged-diff 模式: 只扫 staged **新增行**。
    # 存量失实文案不阻断 commit (G1-4 诚实横幅先行, 防同波自打架);
    # 新增禁夸大声明 (计划书 §12.7 L633 十一类) 即 exit 1 阻断。
    # glob 限 scan_paths 白名单文件 (backend/scripts/readme_claims_rules.yaml)。
    readme-claims-lint:
      glob: "README.md"
      run: |
        if [ -f "backend/.venv/bin/python" ]; then PY="backend/.venv/bin/python"; else PY="python3"; fi
        "$PY" backend/scripts/check_readme_claims.py --staged-diff

    # --- Mutant residue scan (CARD-TOOL-lint-glob, BATCH-2026-09-05-第十一批) ---
    # 变异卡会**原地改生产文件**再还原, 还原失败就把变异体留在树上。X7-A 登记
    # 过一次: 一个 `if False:` 变异体带着标记躺在 card-w7-ledger 上, 直到主
    # session 波 0 才被发现。本门在 commit 前扫暂存区的**新增行**, 命中标记
    # 即 exit 1 阻断(不是 warning)。
    #
    # HONESTY CONTRACT —— 本门抓不到什么(照抄 X7-A 的真实反例, 别把它当锚点):
    #   同一轮变异里 fsrs_bridge.py 被追加了一行 `_s.exit(9)`。它**不带任何
    #   标记**, 于是三个裁判全绿、按标记 grep 得 0, 本门这一类**一条也抓不到**。
    #   本门只是廉价补充; 唯一可靠的锚点仍然是「变异前对所有会被变异的文件取
    #   全文件 sha 基线, 跑完逐个复核」(见 backend/scripts/g32b_mutation_gates.py)。
    #   另: 匹配是**大小写敏感**的字面量, 只认 harness 实际写入的那个大写形态;
    #   小写的散文提及("mutant testing")不会被误拦。
    #
    # 刻意不设 glob: 残留可以落在 .md / .yml / .sh, 不只是 .py。
    # 排除名单写死在下面的 case 里(这几处的标记是**数据**不是残留)。计数是
    # CARD-TOOL-residue-fail-open 于 B14_BASE 08100483 逐文件实测值, 不是估计:
    #   backend/scripts/g32b_mutation_gates.py              变异 harness 本体 151 处
    #   backend/scripts/g32cb_mutation_gates.py             变异 harness 本体 11 处
    #   backend/scripts/g32ccr1_negative_controls.py        负控本体 11 处
    #   backend/scripts/openapi_drift_negative_control.py   负控本体 2 处
    #   backend/tests/regression/recap_domain_negverify.py  负控本体 13 处
    #   .claude/rules/*.md                                  规则文正文引用(按默认补, 待用户确认)
    #   _bmad-output/**                                     审查报告/验收单正文引用
    # ⚠️ 匹配面(本卡实测): case 的 `*` **会匹配 `/`**, 所以 `.claude/rules/*.md` 覆盖
    # 该目录下**任意深度**的 .md(与既有的 `_bmad-output/*` 同口径), 而 `.md.bak`、
    # `notes.txt`、`.claude/rulesX/a.md`、`docs/.claude/rules/a.md` 都**不**在面内。
    # 前两行的计数在第十四批之前写的是 153 / 10, 均已过时(第十三批 U8-B 改过
    # g32b); 后三个文件在第十四批之前**不在名单里** —— 它们一旦被暂存修改就会
    # 被本门拦下(fail-closed 误伤)。`.claude/rules/*.md` 入名单的依据是「规则文
    # 里写标记字面量会被自己的门拦」(第十二批复核报告 §五.10)。
    # 标记串在运行时由两段拼出, 使**本文件自身**不含那个字面量 —— 否则每次
    # 编辑本块都会被自己拦下(判据不可自指)。
    #
    # ⚠️ 执行时机(2026-09-05 实测, 不要按 YAML 位置想当然): lefthook 2.1.6 对
    # 未设 priority 的 commands **按命令名字母序**执行, 不是按 YAML 里的先后。
    # 实测序列(名字首字母): c 开头的 Cypher 门 → g 开头的 ghost-files →
    # m 开头的本块 → python-lint → p 开头的 pyright 门 → r 开头的 README 门
    # → 最后是两个 OpenAPI 快照块(flat / root)。
    # 即本块虽写在段末, 却在那两个快照块**之前**跑; 它们随后 `git add` 的
    # backend/openapi.json **不在本门的扫描面内**(该文件由 app.openapi() 机器
    # 生成, 其源头 backend/app/** 本身在扫描面内)。给本块加 `priority:` 不能
    # 解决 —— 实测任何 priority 值都会把它排到**最前**(带 priority 的命令整体
    # 先于无 priority 的)。要真正排到最后只能改命令名的字母序, 已登台账。
    #
    # 以下防御逐条对应 Codex round-1 的实测反例(全部本机复现过):
    #   -z 直接消费    : `core.quotepath=false` 只关非 ASCII 八进制转义;
    #                    含 `"`/`\`/TAB 的路径仍被 C 引号化, 拿去当 pathspec
    #                    查不到东西 → 静默放行。-z 输出原始字节, 无引号。记录
    #                    按 NUL **逐条直接消费, 不再经 tr 拆行**(tr 会把文件名
    #                    里的 \n 拆成两半); 本 shell 是否真取得回逐字节 NUL 记录
    #                    由块内 probe 段现场自证。
    #   --literal-pathspecs : 文件名里的 `*` `?` `:` 不再被当 pathspec 通配/魔法。
    #   --no-color     : `color.ui=always` 时 diff 带 ANSI 前缀, `^+` 命中数
    #                    实测由 90 掉到 0 → 门静默放行。必须用 diff 的**标志**,
    #                    不能写 `-c color.ui=never` —— 更具体的 `color.diff=always`
    #                    会盖过它(实测该写法下命中仍为 0, 标志写法为 2)。
    #   --no-renames   : 默认 `--diff-filter=AM` 会漏掉被判为 R(重命名)的文件;
    #                    关掉重命名检测后它变成 A, 重新进扫描面。
    #   awk inhunk 状态: 原写法用 `/^\+\+\+/` 认文件头, 会把**正文里**以 `++`
    #                    开头的新增行当成头吞掉, 且不推进行号(实测下一行的行号
    #                    少 1)。现在只有 `@@` 之前的行算文件头。
    #   FAILED 位      : git / awk 失败不再被管道吞成 0; 扫描没跑完 = fail-closed。
    #   mktemp -d      : 0700 私有目录, 取代可预测的 $$ 路径与 `: >` 截断。
    #
    # 以下是 CARD-TOOL-residue-fail-open(BATCH-2026-09-11-第十四批)补的一批, 逐条对应
    # Y4-C 登记的存量 fail-open(「六 + 三 + `-s hits`」)。它们的共同形态是: 某一步失败
    # 了, 但 FAILED 位没被置上, 于是块末照样打 OK 退 0 —— 「门坏了」与「没抓到东西」
    # 在输出上一模一样。每条都配了一份对照(旧版 OK rc=0 / 新版 rc=1), 存档见
    # _bmad-output/审查/evidence-residue-fo/。
    #   --no-ext-diff  : `diff.external` / GIT_EXTERNAL_DIFF 接管输出后 git 仍 rc=0 而
    #                    正文为空(本机实测 0 字节), awk 无输入 ⇒ 零命中。
    #   --no-textconv  : `.gitattributes` 挂 diff=<drv> + textconv 时, awk 拿到的是被
    #                    转换后的文本(实测标记已被换成别的字样) ⇒ 零命中。
    #   --text         : 前 8000 字节含 NUL(或带 -diff 属性)时 git 只输出
    #                    `Binary files … differ`, 无 @@ 无 + 行 ⇒ 零命中。
    #   --diff-filter 加 T : T(typechange, 例如 symlink→普通文件)既不算 A 也不算 M。
    #                    实测同一暂存态下 AM 枚举为空、AMT 枚举得到该文件, 且其新内容
    #                    确实带 + 行。(R 已被 --no-renames 变回 A, 见上一条。)
    #   记录流前置校验 : 暂存清单必须是**可读的普通文件**, 且非空时以 NUL 结尾。只写
    #                    文件会让 `< names` 打不开、目录会让 read 报错 —— 两种情况下
    #                    主循环都跑 0 次而 rc 仍 0; 末条缺 NUL 则末条被 read 直接丢弃。
    #   SEEN/EXPECTED  : 主循环消费的记录数必须等于清单里的 NUL 个数, 否则是被中途吞掉
    #                    (例如 awk 抢读了循环的 stdin)而不是「读完了」。
    #   awk 用 < 重定向: awk 把形如 `name=value` 的操作数当**变量赋值**而不是文件名。
    #                    TMPDIR 为相对路径且首段含 `=` 时 "$TMPD/d" 正是这个形态, awk
    #                    转而读 stdin(也就是循环的记录流)、一次吞完 ⇒ 循环提前结束。
    #                    改成 `< "$TMPD/d"` 后彻底不给操作数。⚠️ 本机 awk(version
    #                    20200816)**不认 `--`**: 实测 `awk '…' -- 'a=b/d'` 报
    #                    can't open file `--`, 且 `a=b/d` 仍被当赋值 —— 用 `--` 挡不住。
    #   临时文件类型   : `>` 不会替掉已有的符号链接, 所以一个指向 /dev/null 的 hits/d/dn 会让
    #                    写进去的东西全丢而每一步都 rc=0(见 case-9 / case-m3)。⚠️ 三个文件的
    #                    核查时机**不一样**, 别写成「都在用之前核」: `d` 与 `dn` 是**写后、用前**
    #                    各核一次「是可读的普通文件」, 外加一条 `d -ef dn`(`-f` 跟随符号链接,
    #                    看不出两者是同一个 inode; 那种情形下 `> dn` 会把 `d` 截空);
    #                    `hits` 只有**末尾那一次**复核 —— 写入与命中读取都发生在它之前。
    #   循环内 git 隔离 stdin : 主循环的 stdin 就是记录流。循环体里任何会读 stdin 的命令
    #                    都可能吃掉下一条路径的一部分, 于是下一次 read 取到残缺路径或空记录
    #                    —— 而哨兵与计数**仍然对得上**(空记录照样计入 SEEN、照样被跳过)。
    #                    故循环内的 git 显式 `</dev/null`。
    #   hits 两处守卫  : `: > hits` 原是全块唯一无显式守卫的一步, 失败要显式报; `[ -s ]`
    #                    为假时还要核 hits 仍是可读普通文件 —— 它若被换成 /dev/null 之类,
    #                    真命中会被写丢而 `[ -s ]` 恒假, 那是「结论取不到」不是「没命中」。
    #
    # 以下四条是 Codex round-1 复核后补的(同卡, 同一批对照):
    #   NUL 归一化     : awk 的字符串是 NUL 终止的。一条新增行里只要标记**前面**出现 NUL,
    #                    index() 就看不见它 —— 实测 `+x<NUL> # <标记>` 判 MISS 且 rc=0。
    #                    只加 --text 不够: git 把完整字节交出来了, awk 却只看到 NUL 之前那截。
    #                    故在喂 awk 之前把 NUL 等长换成 `?`(行号与各种前缀都不受影响)。
    #   LC_ALL=C + 逐段 rc : 管道的 rc 是**末段**的。`tr … | wc … | tr …` 里首段 tr 在
    #                    UTF-8 locale 下遇非法字节序列会报 Illegal byte sequence 并少数一个,
    #                    整链却 rc=0(本机 LANG 实测就是 en_US.UTF-8)。所以碰字节的命令
    #                    (tail / od / tr / awk)都显式钉 LC_ALL=C。
    #                    **rc 覆盖面的确切清单**(逐条核过, 别照抄成「一律」):
    #                      核了 rc 的 —— mktemp / 两处 git / tail / od / wc / 哨兵的 printf /
    #                        NUL 计数那次 tr / NUL 归一化那次 tr / awk。
    #                      **没**单独核 rc 的 —— 两处 `$(LC_ALL=C tr -d ' \n' < …)`、probe
    #                        期望值那个 `$(printf …)`、两次 probe 的 printf、trap 注册本身、
    #                        全部 echo(**包括末尾那条 —— 它直接决定本块的正常退出状态**)、
    #                        两个 while 的终止状态、全部 `[`(不区分 false 与测试出错)。
    #                    ⚠️ 不要写成「tr 失败只会给出空串或非数字」—— tr 是先输出后报错的,
    #                    完全可能既给出有效数字又非零退出。这里真正的兜底是 `!= "0"`、
    #                    EXPECTED 的 case 校验和末尾的 SEEN/EXPECTED 比较, 那是**部分**
    #                    兜底, 不是与核 rc 等价的保证。
    #   结束哨兵       : 「消费条数 == 清单里的 NUL 数」只说明**没少读**, 不说明**读到过**。
    #                    空清单遇上 read 报错会得到 0 == 0 而通过。故往流末追一条绝不可能是
    #                    真实路径的记录(git 路径不以 / 开头), 主循环必须真的读到它。
    #   `: >` 的真实收益: `:` 是 POSIX 特殊内建 —— 在 `sh -c`(本机解析到 bash 的 POSIX 模式)
    #                    下重定向失败**本来就会直接退出 shell**。那条守卫在真实 runner 下是把
    #                    静默退出变成有诊断的阻断; 只有在普通 bash 下它才真把 fail-open 变
    #                    fail-closed。对照脚本两种解释器都跑, 结论如实分开写。
    mutant-residue-scan:
      run: |
        set -u
        MARKER="MUT""ANT"
        TMPD=$(mktemp -d "${TMPDIR:-/tmp}/lefthook-mutant-residue.XXXXXX") || {
          echo "[Mutant-Scan] FAILED: 无法创建临时目录 — 按 fail-closed 阻断。"; exit 1; }
        trap 'rm -rf "$TMPD"' EXIT
        FAILED=0
        if ! git --no-pager diff --cached --no-color --no-ext-diff --no-textconv \
               --no-renames --name-only --diff-filter=AMT -z > "$TMPD/names"; then
          echo "[Mutant-Scan] FAILED: 枚举暂存文件失败 — 按 fail-closed 阻断。"; exit 1
        fi
        # CARD-TOOL-residue-fail-open: 记录流前置校验。三条都必须在主循环之前跑 ——
        # 它们各自对应一种「循环一次都没跑, rc 却是 0」的形态(只写文件 / 目录 / 截断流)。
        # --no-ext-diff 与 --no-textconv 对 --name-only 是惰性的, 写在这里是为了让两个
        # git 调用点的标志集保持一致, 以后不会只改一处。
        if [ ! -f "$TMPD/names" ] || [ ! -r "$TMPD/names" ]; then
          echo "[Mutant-Scan] FAILED: 暂存清单不是可读的普通文件 —"
          echo "[Mutant-Scan]   这不是「没有暂存文件」, 按 fail-closed 阻断。"
          exit 1
        fi
        # ⚠️ 下面的字节处理都钉 LC_ALL=C; 其中 tail / od / wc 各自核 rc(两处 `$(tr -d …)`
        # 没核, 清单见上方注释段的「rc 覆盖面」)。之所以不写成一条管道: 管道的 rc 是
        # 末段的, 首段(tr)在 UTF-8 locale 下遇到非法字节序列会报 `Illegal byte sequence`
        # 并少数一个, 而整链仍 rc=0。本机 LANG 实测就是 en_US.UTF-8, 这不是假想。
        if [ -s "$TMPD/names" ]; then
          if ! LC_ALL=C tail -c 1 "$TMPD/names" > "$TMPD/lastb"; then
            echo "[Mutant-Scan] FAILED: 取暂存清单末字节失败 — 按 fail-closed 阻断。"; exit 1
          fi
          if ! LC_ALL=C od -An -tu1 < "$TMPD/lastb" > "$TMPD/lastd"; then
            echo "[Mutant-Scan] FAILED: 解析暂存清单末字节失败 — 按 fail-closed 阻断。"; exit 1
          fi
          # 这一步的 rc 没核(tr 是先输出后报错的, 有可能既给出有效数字又非零退出)。
          # 兜底只有下面的 `!= "0"` —— 那是**部分**兜底, 不是与核 rc 等价的保证。
          LASTB=$(LC_ALL=C tr -d ' \n' < "$TMPD/lastd")
          if [ "$LASTB" != "0" ]; then
            echo "[Mutant-Scan] FAILED: 暂存清单末条没有 NUL 终止(记录流被截断) —"
            echo "[Mutant-Scan]   末条会被 read 直接丢弃, 按 fail-closed 阻断。"
            exit 1
          fi
        fi
        # 结束哨兵: 往记录流末尾追一条**绝不可能是真实路径**的记录(git 路径不以 / 开头),
        # 主循环必须真的读到它。没有它, 空清单 + read 报错会得到 SEEN=EXPECTED=0 而通过
        # —— 计数相等只说明「没少读」, 不说明「读到过任何东西」。
        SENTINEL='/__mutant-scan-eof__'
        printf '%s\000' "$SENTINEL" >> "$TMPD/names" || {
          echo "[Mutant-Scan] FAILED: 无法追加结束哨兵 — 按 fail-closed 阻断。"; exit 1; }
        if ! LC_ALL=C tr -dc '\000' < "$TMPD/names" > "$TMPD/nuls"; then
          echo "[Mutant-Scan] FAILED: 统计暂存清单记录数失败 — 按 fail-closed 阻断。"; exit 1
        fi
        if ! wc -c < "$TMPD/nuls" > "$TMPD/nulcount"; then
          echo "[Mutant-Scan] FAILED: 统计暂存清单记录数失败 — 按 fail-closed 阻断。"; exit 1
        fi
        EXPECTED=$(LC_ALL=C tr -d ' \n' < "$TMPD/nulcount")
        case "$EXPECTED" in
          ''|*[!0-9]*)
            echo "[Mutant-Scan] FAILED: 暂存清单记录数不是数字 — 按 fail-closed 阻断。"
            exit 1 ;;
        esac
        # CARD-TOOL-residue-newline: 按 NUL 直接消费 -z, 不再经 tr 拆行 —— tr 把文件名里的
        # \n 拆成两半, 两半各自当路径查 diff, git 对不存在的路径 rc=0 且无输出 => 静默放行。
        # 下面先自证本 shell 真能逐字节取回 NUL 记录: 载荷同时带反斜线/换行/前导空格,
        # 故 -r、IFS=、-d '' 任缺一个都判不过; dash 等纯 POSIX sh 无 read -d, 一次都不循环。
        # CARD-TOOL-residue-fail-open 把这条取舍写实(对应 Y4-C Codex §4 MEDIUM):
        # 本块**要求** read -d。/bin/sh 若是 dash 等纯 POSIX sh, 下面这段必然判不过,
        # 于是**连干净暂存面也会被阻断** —— 这是明知的取舍(宁可停下也不放行), 不是 bug;
        # 「跨平台正常提交不受影响」这句话不成立, 不要再照抄。lefthook 2.1.6 起的是
        # `sh -c`, 这个 `sh` 由 lefthook 进程的 PATH 查找, **不是**硬编码 /bin/sh;
        # 本机当前解析到 /bin/sh = bash 3.2.57, 支持 read -d, 故走不到这条分支
        # (换句话说: PATH 上先出现一个纯 POSIX sh 就会走到)。真要支持纯 POSIX sh 必须换掉整套 NUL 读法,
        # 那是另一张卡的面 —— 在那之前**不得**把这里改成「是 dash 就降级放行」。
        printf 'a\\\nb\000 c\000' > "$TMPD/probe"
        PROBE_ACC=""
        while IFS= read -r -d '' _p; do PROBE_ACC="$PROBE_ACC|$_p"; done < "$TMPD/probe"
        if [ "$PROBE_ACC" != "$(printf '|a\\\nb| c')" ]; then
          echo "[Mutant-Scan] FAILED: 本 shell 的 'IFS= read -r -d' 取不回逐字节 NUL 记录 —"
          echo "[Mutant-Scan]   /bin/sh 若是 dash 等纯 POSIX sh 必然走到这里。按 fail-closed 阻断。"
          exit 1
        fi
        # ⚠️ 如实声明(Codex round-1): `:` 是 POSIX 特殊内建, 在真实 runner(`sh -c`, 本机
        # 解析到 bash 的 POSIX 模式)下, 这一步重定向失败**本来就会直接退出 shell**、rc 非零。
        # 所以这条守卫在真实 runner 下的价值不是「把放行变成阻断」, 而是「把一句
        # Permission denied 的静默退出变成一条说得清是哪一步的阻断」。在普通 bash(非 POSIX
        # 模式)下它才真的是把 fail-open 变 fail-closed —— 对照脚本两种解释器都跑, 见存档。
        : > "$TMPD/hits" || {
          echo "[Mutant-Scan] FAILED: 无法初始化命中文件 — 按 fail-closed 阻断。"; exit 1; }
        SEEN=0
        SAW_SENTINEL=0
        while IFS= read -r -d '' f; do
          SEEN=$((SEEN + 1))
          if [ "$f" = "$SENTINEL" ]; then SAW_SENTINEL=1; continue; fi
          [ -n "$f" ] || continue
          case "$f" in
            backend/scripts/g32b_mutation_gates.py) continue ;;
            backend/scripts/g32cb_mutation_gates.py) continue ;;
            backend/scripts/g32ccr1_negative_controls.py) continue ;;
            backend/scripts/openapi_drift_negative_control.py) continue ;;
            backend/tests/regression/recap_domain_negverify.py) continue ;;
            .claude/rules/*.md) continue ;;
            _bmad-output/*) continue ;;
          esac
          # `</dev/null`: 循环内的 git 绝不能继承循环的 stdin —— 那是记录流本身。任何
          # 从 stdin 读掉一点字节的东西都会让下一条 read 取到残缺路径(或空记录), 而哨兵
          # 与计数都仍然对得上(空记录照样计入 SEEN、照样被跳过) ⇒ 那条文件就此漏扫。
          if ! git --no-pager --literal-pathspecs diff --cached --no-color \
                 --no-ext-diff --no-textconv --text \
                 --no-renames -U0 --diff-filter=AMT -- "$f" > "$TMPD/d" </dev/null; then
            echo "[Mutant-Scan] FAILED: 取 diff 失败: $f"; FAILED=1; continue
          fi
          # d / dn 必须是可读普通文件。它们若被换成 /dev/null 之类, 写进去的 diff 会被丢掉
          # 而每一步都 rc=0 —— 与 hits 那条同型(见 case-9)。`>` 不会替掉已有的符号链接, 所以
          # 这个检查要在写之后做。
          if [ ! -f "$TMPD/d" ] || [ ! -r "$TMPD/d" ]; then
            echo "[Mutant-Scan] FAILED: diff 暂存文件不是可读的普通文件: $f"; FAILED=1; continue
          fi
          # NUL 归一化(必需, 不是保险): awk 的字符串是 NUL 终止的, 一条新增行里只要标记
          # **前面**出现 NUL, index() 就看不见它 —— 本机实测 `+x<NUL> # <标记>` 判 MISS 而
          # rc=0。--text 让 git 吐出完整字节, 归一化让 awk 真能看完这些字节, 两者缺一不可。
          # 换成 '?' 是等长替换: 行号、`+`/`@@`/`diff --git` 前缀、命中列都不受影响, 也不会
          # 凭空造出标记(标记全是 ASCII 字母)。LC_ALL=C 免得 tr 在 UTF-8 locale 下拒收非法字节。
          if ! LC_ALL=C tr '\000' '?' < "$TMPD/d" > "$TMPD/dn"; then
            echo "[Mutant-Scan] FAILED: NUL 归一化失败: $f"; FAILED=1; continue
          fi
          if [ ! -f "$TMPD/dn" ] || [ ! -r "$TMPD/dn" ]; then
            echo "[Mutant-Scan] FAILED: 归一化后的 diff 不是可读的普通文件: $f"; FAILED=1; continue
          fi
          # d 与 dn 必须是**两个不同的 inode**。若 dn 事先被做成指向 d 的链接(符号或硬链接),
          # `< d > dn` 会在读之前把同一个 inode 截断成空: git/tr/awk 全都 rc=0, hits 正常为空,
          # 类型检查也过(它们都是普通文件) —— 整份 diff 就这么没了。`-f` 跟随符号链接,
          # 所以只靠类型检查看不出来; `-ef` 比的是 inode, 两种链接都能认出来。
          if [ "$TMPD/d" -ef "$TMPD/dn" ]; then
            echo "[Mutant-Scan] FAILED: diff 与其归一化副本指向同一个文件: $f"; FAILED=1; continue
          fi
          F="$f" LC_ALL=C awk -v M="$MARKER" '
            BEGIN          { F = ENVIRON["F"] }
            /^diff --git / { inhunk = 0; next }
            /^@@/          { split($3, a, ","); ln = a[1] + 0; inhunk = 1; next }
            !inhunk        { next }
            /^\+/          { if (index($0, M)) printf "  %s:%d: %s\n", F, ln, substr($0, 2); ln++; next }
            /^ /           { ln++; next }
            { next }
          ' < "$TMPD/dn" >> "$TMPD/hits" || { echo "[Mutant-Scan] FAILED: 解析失败: $f"; FAILED=1; }
        done < "$TMPD/names"
        if [ "$SAW_SENTINEL" -ne 1 ]; then
          echo "[Mutant-Scan] FAILED: 主循环没读到结束哨兵 — 记录流没被完整消费"
          echo "[Mutant-Scan]   (打不开 / 读报错 / 被别的命令吞掉都会走到这里)。按 fail-closed 阻断。"
          exit 1
        fi
        if [ "$SEEN" -ne "$EXPECTED" ]; then
          echo "[Mutant-Scan] FAILED: 暂存清单 $EXPECTED 条, 主循环只消费了 $SEEN 条 —"
          echo "[Mutant-Scan]   记录流中途读失败或被别的命令吞掉, 这不是「读完了」。按 fail-closed 阻断。"
          exit 1
        fi
        if [ "$FAILED" -ne 0 ]; then
          echo "[Mutant-Scan] 扫描未完成(见上) — 这不是「没发现标记」, 按 fail-closed 阻断。"
          exit 1
        fi
        if [ -s "$TMPD/hits" ]; then
          echo ""
          echo "[Mutant-Scan] BLOCKED — 暂存的新增行里带变异残留标记:"
          cat "$TMPD/hits"
          echo ""
          echo "[Mutant-Scan] 变异 harness 没还原干净。先 restore 被改的生产文件,"
          echo "[Mutant-Scan] 再拿变异前的全文件 sha 基线逐个复核 —— 标记只是最弱那道网。"
          exit 1
        fi
        # `[ -s hits ]` 为假有两种成因: (1) 真的一条都没命中; (2) hits 的状态根本取不到
        # (被换成 /dev/null 之类的非普通文件, 写进去的命中被丢掉, 于是恒假)。
        # 只有排除掉 (2) 才敢把「没命中」当结论。
        if [ ! -f "$TMPD/hits" ] || [ ! -r "$TMPD/hits" ]; then
          echo "[Mutant-Scan] FAILED: 命中文件不是可读的普通文件 —"
          echo "[Mutant-Scan]   「没有命中」这个结论取不到, 按 fail-closed 阻断。"
          exit 1
        fi
        echo "[Mutant-Scan] OK (staged additions carry no mutation marker)."

# ============================================================
# Commit-msg: Conventional commits with commitlint
# ============================================================
commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

    # --- Spec reference check: code commits must reference FR/spec ---
    spec-reference:
      run: |
        # Round-23: 加 git rev-parse --git-dir fallback 兼容 worktree mode
        # (worktree 下 .git 是文件 + lefthook shell `$1` 不被替换为 commit-msg path)
        MSG=$(cat "$1" 2>/dev/null \
          || cat "$(git rev-parse --git-dir)/COMMIT_EDITMSG" 2>/dev/null \
          || cat .git/COMMIT_EDITMSG 2>/dev/null \
          || echo "")
        # Check if commit touches code files
        # ChatGPT-Review 2026-05-11 P0-1 fix: `frontend/src/` → `frontend/obsidian-plugin/src/`
        # (旧路径不存在, 真实插件代码在 frontend/obsidian-plugin/src/)
        CODE_CHANGED=$(git diff --cached --name-only | grep -E "^(backend/app/|frontend/obsidian-plugin/src/)" || true)
        if [ -n "$CODE_CHANGED" ]; then
          # Require @spec:, FR-, or PLAN- reference in commit message
          if ! echo "$MSG" | grep -qE "(@spec:|FR-|PLAN-|Co-Authored-By)"; then
            echo ""
            echo "  COMMIT BLOCKED: Code change requires spec/plan reference."
            echo "  Add @spec: domain-nnn, FR-XXX-NN, or PLAN-NNN to your commit message."
            echo "  Example: fix(FR-EXAM-01): implement exam scoring PLAN-003 @spec: algo-scoring-001"
            echo ""
            exit 1
          fi
          # Require Story: trailer for backend/frontend code changes
          if ! echo "$MSG" | grep -qE "^Story:\s*[0-9]+\.[0-9]+" && ! echo "$MSG" | grep -q "Co-Authored-By"; then
            echo ""
            echo "  WARNING: backend/frontend change missing 'Story: x.y' trailer."
            echo "  Add 'Story: 30.23' as a git trailer for traceability."
            echo ""
          fi
        fi
        echo "[Spec Ref] OK."

# GOV-01 Bootstrap-0: post-commit network writes are intentionally absent.
# Local commits remain local until the user explicitly authorizes a push.

# ============================================================
# Pre-push: Blocking checks before push
# ============================================================
pre-push:
  parallel: true
  commands:
    # --- Frontend test: Run plugin tests before push ---
    # ChatGPT-Review 2026-05-11 P0-1 fix: glob from `frontend/src/**` (non-existent)
    # → `frontend/obsidian-plugin/src/**`; command from `vitest` (not used) → `npm test`
    # (esbuild + node --test, matches frontend/obsidian-plugin/package.json scripts.test).
    # Pre-fix the gate was silently passing because no files matched the glob.
    #
    # fix-test-infra-paralysis Phase 0.2 (f19dcff6, cherry-picked 2026-09-06):
    # the invocation goes through scripts/run_cmd_capture.sh so a non-zero
    # `npm test` exit code is NOT swallowed by `| tail`. POSIX pipelines return
    # only the rightmost command's exit status, so the previous version let
    # failing plugin tests through pre-push. Only the pipe→wrapper transform is
    # taken from f19dcff6; its literal glob and runner predate the
    # ChatGPT-Review P0-1 fix above and are deliberately NOT applied.
    #
    # Codex round-1 HIGH-1 (2026-09-06): the wrapper alone is NOT enough. lefthook
    # runs each `run` block through `sh -c` without `-e`, so the block's exit code
    # is that of its LAST command — the trailing `echo` returned 0 and masked the
    # wrapper's code (measured: wrapper line alone rc=127, whole block rc=0).
    # f19dcff6 has the same defect. `|| exit $?` makes the block exit on failure
    # before reaching the echo; backend-smoke below solves it the other way, with
    # an explicit `exit $TEST_EXIT`.
    frontend-test:
      glob: "frontend/obsidian-plugin/{src,tests}/**/*.{ts,tsx}"
      run: |
        if [ -d "frontend/obsidian-plugin/node_modules" ]; then
          echo "[Pre-push] Running plugin tests (node --test via esbuild bundle)..."
          ./scripts/run_cmd_capture.sh --cwd frontend/obsidian-plugin --tail 120 -- npm test || exit $?
          echo "[Pre-push] Plugin tests done."
        else
          echo "[Pre-push] frontend/obsidian-plugin/node_modules missing — run 'npm --prefix frontend/obsidian-plugin install' first. Skipping."
        fi

    # --- Backend smoke test: A11 regression suite (narrow gate) ---
    # WHY NARROW: 2026-04-07 audit discovered 136 failures + 38 collection
    # errors in the full backend/tests/unit/ suite (pre-existing test debt,
    # unrelated to this gate). The gate was previously silent-passing for
    # weeks because it used system `python` which lacks pytest.
    #
    # WHY A11 SUITE: test_kg_relevance_weighted + test_a11_kg_relevance_e2e
    # together form the FR-KG-04 schema drift regression guard (30 tests,
    # ~1s, known-green as of commit b50a089). Changes to CanvasNode schema,
    # Cypher queries in question_generator, or kg_relevance weighting will
    # be caught by this gate.
    #
    # WHAT'S NOT CAUGHT: changes outside the FR-KG-04 code path. A broader
    # gate requires first paying down the 136-failure pre-existing debt.
    #
    # Exit code is preserved via explicit $? capture (previous `| tail -5`
    # pipe silently swallowed pytest exit code).
    backend-smoke:
      run: |
        if [ -f "backend/.venv/bin/python" ]; then
          echo "[Pre-push] Running A11 regression suite..."
          cd backend
          .venv/bin/python -m pytest \
            tests/unit/test_kg_relevance_weighted.py \
            tests/e2e/test_a11_kg_relevance_e2e.py \
            -q --tb=line --no-header \
            -p no:cacheprovider \
            --override-ini="addopts="
          TEST_EXIT=$?
          echo "[Pre-push] A11 regression done (exit: $TEST_EXIT)."
          exit $TEST_EXIT
        else
          echo "[Pre-push] backend/.venv not found, skipping."
        fi

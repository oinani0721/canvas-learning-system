# Canvas Learning System - Docker Compose Configuration
# Story 1.1: Project Scaffold & Docker Setup
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up -d neo4j        # Start Neo4j only
#   docker-compose logs -f            # View logs
#   docker-compose down               # Stop and remove containers
#
# Prerequisites:
#   - Docker Desktop installed
#   - Copy .env.example to .env and set NEO4J_PASSWORD + CANVAS_BASE_PATH

version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # Neo4j Graph Database
  # ═══════════════════════════════════════════════════════════════════════════
  neo4j:
    image: neo4j:5.26-community
    container_name: canvas-learning-system-neo4j

    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_allow__upgrade=true

    # NOTE: Using 7478/7691 to avoid conflict with existing Neo4j instances (7474/7476/7687/7689)
    ports:
      # P0-0 (2026-07-31 二轮审查): 绑定 127.0.0.1 — MCP 工具无鉴权,
      # 0.0.0.0 会把全部读写工具暴露给局域网任意主机
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7478}:7474"  # HTTP Browser
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7691}:7687"  # Bolt Protocol

    volumes:
      # P0-C 迁移 (2026-07-12): 绝对路径指向主仓稳定目录 — 学习记忆图谱 (519MB,
      # 唯一不可再生数据) 曾寄居 feature-deeptutor-canvas-mvp 旧 worktree 的
      # bind-mount (相对路径 + 启动目录漂移所致), worktree 清理 = 记忆蒸发。
      # 备份: backend/data/backups/neo4j-full-export-2026-07-12.cypher
      - /Users/Heishing/Desktop/canvas/canvas-learning-system/docker/neo4j/data:/data
      - /Users/Heishing/Desktop/canvas/canvas-learning-system/docker/neo4j/logs:/logs
      - /Users/Heishing/Desktop/canvas/canvas-learning-system/docker/neo4j/plugins:/plugins

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

    restart: unless-stopped

    networks:
      - canvas-network

  # ═══════════════════════════════════════════════════════════════════════════
  # Neo4j Test Instance - 测试专用，与产品数据完全隔离
  # Port 7692 (Bolt) / 7479 (Browser)
  # ═══════════════════════════════════════════════════════════════════════════
  neo4j-test:
    image: neo4j:5.26-community
    container_name: canvas-learning-system-neo4j-test
    profiles:
      - test
      - dev

    environment:
      - NEO4J_AUTH=${NEO4J_TEST_USER:-neo4j}/${NEO4J_TEST_PASSWORD:-testpassword}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G

    ports:
      - "127.0.0.1:7479:7474"  # HTTP Browser - test instance
      - "127.0.0.1:7692:7687"  # Bolt Protocol - test connection

    volumes:
      - neo4j-test-data:/data

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped

    networks:
      - canvas-network

  # ═══════════════════════════════════════════════════════════════════════════
  # Ollama - Local LLM / Embedding Server
  # Story 1.1 Task 1.2: Ollama service for bge-m3 embeddings
  # ⚠️ Mac: Ollama runs NATIVELY (brew install ollama) for Metal GPU access.
  #    Docker Ollama is Windows/Linux only (NVIDIA GPU passthrough).
  #    On Mac, backend reaches native Ollama via host.docker.internal:11434.
  # ═══════════════════════════════════════════════════════════════════════════
  ollama:
    image: ollama/ollama:latest
    container_name: canvas-learning-system-ollama
    profiles: ["windows"]  # Only start on Windows/Linux with NVIDIA GPU

    environment:
      - OLLAMA_NUM_PARALLEL=1    # V7: explicit single-request (RTX 4060 8GB VRAM budget)
      - OLLAMA_MAX_QUEUE=8       # V7: prevent unbounded queue buildup under burst traffic

    ports:
      - "127.0.0.1:11434:11434"

    volumes:
      - ./docker/ollama/models:/root/.ollama/models

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    restart: unless-stopped

    # GPU passthrough for Ollama (RTX 4060 — Qwen3 8B inference ~37s vs CPU 120s)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    networks:
      - canvas-network

  # ═══════════════════════════════════════════════════════════════════════════
  # FastAPI Backend
  # Story 1.1 Task 1.1: FastAPI service with health check
  # ═══════════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canvas-learning-system-backend

    ports:
      # P0-0 (2026-07-31): 实测无 key POST /mcp/tools/* 返回 200 — 收口到本机回环
      - "127.0.0.1:${API_PORT:-8001}:8001"

    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_BASE_URL=${OLLAMA_HOST:-http://host.docker.internal:11434}  # P0 fix: lancedb_client 读 OLLAMA_BASE_URL，与 OLLAMA_HOST 别名同步
      - CANVAS_BASE_PATH=/vaults/${ACTIVE_VAULT:-canvas-vault}  # Story 2.2 follow-up: 顶级 /vaults 脱离 /app 嵌套
      - VAULTS_ROOT=/vaults  # 同上
      - ACTIVE_VAULT=${ACTIVE_VAULT:-canvas-vault}
      - LANCEDB_DATA_PATH=/lancedb  # Story 2.2 Phase A: 顶级路径，完全脱离 /app 嵌套（worktree backend/lancedb 子目录会被 ./backend:/app bind mount 屏蔽 named volume）
      - PYTHONPATH=/app:/app/src
      - DEBUG=${DEBUG:-false}  # ChatGPT-DR-2026-05-13 P0-2: 默认 false (fail-closed)
      # 本机 loopback dev 旁路 (2026-07-10): 默认 false fail-closed; 单机开发在 .env 显式
      # 开 true, 否则 enrich-hook/tips 同步全部 401。分发给他人时必须改用 INTERNAL_API_KEY。
      - ALLOW_UNSAFE_DEV_AUTH_BYPASS=${ALLOW_UNSAFE_DEV_AUTH_BYPASS:-false}
      # 内部 API key (2026-07-10): 宿主经 docker 端口映射的源 IP 非 loopback,旁路无效,
      # 实际鉴权靠此 key(插件 X-CLS-Internal-Key 头 + vault hook 同头)
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://tauri.localhost,app://obsidian.md}
      # GOOGLE_API_KEY: P0 2026-05-14 — 从 host shell env 传入容器以让 GraphitiEpisodeWorker 启用。
      # 之前的注释"read from backend/.env via load_dotenv"在 worker 启动早于 dotenv load 时不生效。
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # GEMINI_API_KEY: B1 修复 (2026-07-12) — litellm 的 gemini/ 路由查此变量名, 与 GOOGLE_API_KEY 同值
      - GEMINI_API_KEY=${GOOGLE_API_KEY:-}
      # SEMAPHORE_LIMIT: M2 修复 (2026-07-13) — graphiti_core.helpers 在 import 时绑定,
      # 必须进程启动前注入 (episode_worker 内的运行时赋值无效)。本地 35B 模型场景设 1。
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:-3}
      # 可切换 embedder (2026-06-26): gemini(默认) | openai | local。
      # local = Ollama/LM Studio 本地 bge-m3 (1024 维, 不受 Gemini 地理封锁)。
      # 用法: 宿主 `ollama serve` + `ollama pull bge-m3`, 然后
      #   EMBEDDER_PROVIDER=local docker compose up -d backend
      - EMBEDDER_PROVIDER=${EMBEDDER_PROVIDER:-gemini}
      - LOCAL_EMBEDDER_BASE_URL=${LOCAL_EMBEDDER_BASE_URL:-http://host.docker.internal:11434/v1}
      - LOCAL_EMBEDDER_MODEL=${LOCAL_EMBEDDER_MODEL:-bge-m3}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_EMBEDDER_MODEL=${OPENAI_EMBEDDER_MODEL:-text-embedding-3-small}
      # 可切换 Graphiti LLM (M1/M2 2026-07-13): gemini(默认) | local。
      # local = 宿主 llama-server Qwen3.5-35B-A3B (:12341, 启动脚本
      # scripts/local-llm/start-qwen-graphiti.sh)。⛔ fail-closed: 切 local
      # 前必须 schema canary 50 跑零失败 (2026-07-13 基线已通过, 见 .env)。
      - GRAPHITI_LLM_PROVIDER=${GRAPHITI_LLM_PROVIDER:-gemini}
      - GRAPHITI_LLM_BASE_URL=${GRAPHITI_LLM_BASE_URL:-http://host.docker.internal:12341/v1}
      - GRAPHITI_LLM_MODEL=${GRAPHITI_LLM_MODEL:-}
      # reranker (M5): local 必须指向 llama-server --rerank (:18012), 不可指 Ollama/LM Studio
      - GRAPHITI_RERANKER_PROVIDER=${GRAPHITI_RERANKER_PROVIDER:-gemini}
      - GRAPHITI_RERANKER_BASE_URL=${GRAPHITI_RERANKER_BASE_URL:-http://host.docker.internal:18012/v1}
      # CARD-G6-1 (2026-08-31): 总览页「刷新投影」端点调用的生产器脚本位置。/vaults 是主仓根
      # (main 分支), 而 main 的 scripts/ 里没有 daily-review 一族 —— 显式指到部署 worktree 的那份。
      # 用户 2026-08-31 裁定「甲」(路径绑死 worktree 名, 改名即失效; 治本方案 = 并进 main 的 scripts/)。
      # 回退: 删本行 + `docker compose up -d backend`。
      - DAILY_REVIEW_PICK=${DAILY_REVIEW_PICK:-/vaults/.claude/worktrees/feature-obsidian-hybrid-dev/scripts/daily_review_pick.py}
    extra_hosts:
      # 让容器内能用 host.docker.internal 访问宿主机 Ollama (Linux 需要; Mac/Win 默认有)
      - "host.docker.internal:host-gateway"

    volumes:
      - ./backend:/app
      - ./src:/app/src
      - canvas-lancedb:/lancedb  # Story 2.2 Phase A: 顶级 /lancedb，完全脱离 /app 嵌套 — 避免任何 backend/* bind mount 屏蔽
      # ⛔ 已移除 `- ./data:/app/data` (R11-BATCH2-2026-08-17)。理由: 该行是嵌套 bind
      # (/app/data 在 /app 之下)，被 `./backend:/app` 父挂载遮蔽 —— docker inspect 记录了它，
      # 但容器 /proc/self/mountinfo 里从不出现，实际生效的一直是 backend/data/。
      # 遮蔽与否取决于挂载顺序，一次 recreate 就可能翻转 → 届时 /app/data 会被内容稀薄的
      # worktree/data/ 覆盖: reference_priority.json 消失(退 fallback 旧权重)、92 行死信不可见、
      # llm_call_logs.db / presets/ / outbox/ 全部换成另一套。删除后 /app/data 恒等于
      # backend/data/ (经由 ./backend:/app)，与删除前的实际状态逐字节一致。
      - "${VAULTS_ROOT:-.}:/vaults:${VAULT_MOUNT_MODE:-rw}"  # Story 2.2 follow-up: 顶级 /vaults 与 /app 平行，无嵌套屏蔽
      # HF 模型缓存持久化 (2026-07-12): BGEM3 2GB 权重曾缓存在容器层 —
      # 每次容器重建都重新从 HF Hub 下载, 期间全部 embedding 请求挂起
      - canvas-hf-cache:/root/.cache/huggingface

    depends_on:
      neo4j:
        condition: service_healthy
      # ollama: removed — Mac uses native Ollama (host.docker.internal:11434)

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: unless-stopped

    networks:
      - canvas-network
      # Story 1.13: cliproxyapi-network only when ENABLE_CLIPROXY=true
      # Uncomment the line below if using CLIProxy API integration:
      # - cliproxyapi-network

  # ═══════════════════════════════════════════════════════════════════════════
  # Claude Dev Container - Automated development pipeline
  # ═══════════════════════════════════════════════════════════════════════════
  claude-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.claude
    container_name: claude-dev
    profiles:
      - dev
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_CONFIG_DIR=/workspace/.claude
      - CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1
      - TERM=tmux-256color
      - NEO4J_TEST_URI=bolt://neo4j-test:7687
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
    networks:
      - canvas-network
    depends_on:
      neo4j-test:
        condition: service_healthy
      ollama:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "/usr/local/bin/init-firewall.sh &&
      tmux new-session -d -s main &&
      tail -f /dev/null"

# ═══════════════════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════════════════
networks:
  canvas-network:
    driver: bridge
    name: canvas-learning-network
  # Story 1.13: conditional external network (only needed for CLIProxy integration)
  # cliproxyapi-network:
  #   external: true
  #   name: cliproxyapi_default

volumes:
  canvas-lancedb:
    name: canvas-lancedb-data
    external: true  # Story 2.2 Phase A: 跨 worktree project 复用同一 LanceDB 数据；多 vault 切换的部署根基
  canvas-hf-cache:
    name: canvas-hf-cache  # HF 模型缓存 (2026-07-12): 容器重建不再重新下载 BGEM3
  neo4j-test-data:
    name: canvas-neo4j-test-data
